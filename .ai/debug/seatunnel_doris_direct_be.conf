env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:mysql://127.0.0.1:3306/case_workbench?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "root"
    password = "luwang951753"
    query = "select `case_id`, `case_no`, `case_type`, `area_name`, `accept_time`, `amount`, `status`, `update_time` from `ajxx_tab`"
    result_table_name = "sync_source"
  }
}

transform {
  Sql {
    source_table_name = "sync_source"
    result_table_name = "sync_mapped"
    query = "select case_id, case_no, case_type, area_name, accept_time, amount, status, update_time from sync_source"
  }
}

sink {
  Doris {
    source_table_name = "sync_mapped"
    fenodes = "127.0.0.1:8040"
    query-port = 9030
    username = "root"
    password = ""
    database = "ads"
    table = "ajxx_tab"
    table.identifier = "ads.ajxx_tab"
    sink.label-prefix = "dataflow_sync"
    sink.enable-2pc = true
    sink.enable-delete = false
    sink.buffer-count = 3
    doris.batch.size = 1024
    sink.check-interval = 10000
    sink.max-retries = 3
    needs_unsupported_type_casting = false
    case_sensitive = false
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
    save_mode_create_template = """
      CREATE TABLE IF NOT EXISTS `${database}`.`${table_name}` (
        ${rowtype_primary_key},
        ${rowtype_fields}
      )
      ENGINE=OLAP
      UNIQUE KEY (${rowtype_primary_key})
      DISTRIBUTED BY HASH (${rowtype_primary_key})
      PROPERTIES (
        "replication_allocation" = "tag.location.default: 1"
      );
    """
    doris.config = {
      format = "json"
      read_json_by_line = "true"
      strip_outer_array = "false"
      load_to_single_tablet = "false"
    }
  }
}