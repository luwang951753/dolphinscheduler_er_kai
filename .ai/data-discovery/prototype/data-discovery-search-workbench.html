<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>数据探查与找数找字段原型</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: #fff;
      --panel-soft: #f8fafc;
      --line: #dbe3ef;
      --line-strong: #cbd5e1;
      --text: #1f2937;
      --muted: #667085;
      --faint: #98a2b3;
      --blue: #1769e0;
      --blue-soft: #eaf2ff;
      --green: #0f766e;
      --green-soft: #e7f6f2;
      --amber: #b86b00;
      --amber-soft: #fff6df;
      --red: #c2410c;
      --red-soft: #fff0e8;
      --purple: #6941c6;
      --purple-soft: #f2edff;
      --shadow: 0 10px 24px rgba(15, 23, 42, 0.07);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }

    .app {
      height: 100vh;
      display: grid;
      grid-template-rows: 54px minmax(0, 1fr);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 18px;
      border-bottom: 1px solid var(--line);
      background: #fff;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 210px;
      font-weight: 800;
      font-size: 16px;
    }
    .brand-mark {
      width: 30px;
      height: 30px;
      border-radius: 7px;
      background: #1769e0;
      color: #fff;
      display: grid;
      place-items: center;
      font-weight: 900;
    }
    .nav {
      flex: 1;
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 5px;
      overflow: hidden;
    }
    .nav-item {
      height: 34px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 10px;
      color: #344054;
      border-radius: 6px;
      white-space: nowrap;
    }
    .nav-item.active {
      color: var(--blue);
      background: var(--blue-soft);
      font-weight: 750;
    }
    .nav-ico {
      width: 16px;
      height: 16px;
      border: 1.8px solid currentColor;
      border-radius: 4px;
    }
    .user {
      color: var(--muted);
      white-space: nowrap;
    }

    .page {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      padding: 16px 18px;
    }

    .search-hero {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      padding: 18px;
      display: grid;
      grid-template-columns: minmax(420px, 1fr) 330px;
      gap: 18px;
      align-items: center;
    }
    .hero-title {
      margin: 0 0 12px;
      font-size: 22px;
      line-height: 30px;
      letter-spacing: 0;
    }
    .search-box {
      height: 46px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) auto;
      align-items: center;
      border: 2px solid #bcd1f7;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .search-icon {
      color: var(--blue);
      font-size: 18px;
      text-align: center;
    }
    .search-box input {
      min-width: 0;
      height: 100%;
      border: none;
      outline: none;
      font-size: 15px;
      color: var(--text);
    }
    .search-box button {
      height: 100%;
      border: none;
      background: var(--blue);
      color: #fff;
      padding: 0 18px;
      font-weight: 750;
    }
    .quick-words {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: 10px;
      color: var(--muted);
    }
    .quick-word {
      border: 1px solid var(--line);
      background: var(--panel-soft);
      color: #344054;
      border-radius: 999px;
      padding: 4px 9px;
      cursor: pointer;
    }
    .quick-word:hover {
      border-color: #9bbbf0;
      color: var(--blue);
      background: var(--blue-soft);
    }
    .hero-metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .metric-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      background: var(--panel-soft);
    }
    .metric-num {
      font-size: 22px;
      font-weight: 850;
      line-height: 28px;
    }
    .metric-label {
      margin-top: 3px;
      color: var(--muted);
    }

    .workbench {
      min-height: 0;
      display: grid;
      grid-template-columns: 270px minmax(0, 1fr) 390px;
      gap: 12px;
    }
    .panel {
      min-height: 0;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .panel-head {
      min-height: 46px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }
    .panel-title {
      font-weight: 800;
      color: var(--text);
    }
    .panel-body {
      min-height: 0;
      overflow: auto;
    }

    .filters {
      padding: 12px;
      display: grid;
      gap: 12px;
    }
    .filter-group {
      display: grid;
      gap: 7px;
    }
    .filter-title {
      color: #344054;
      font-size: 12px;
      font-weight: 800;
    }
    .check-row {
      min-height: 28px;
      display: flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
    }
    .check-row input { accent-color: var(--blue); }
    .mini-select {
      height: 30px;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #344054;
      padding: 0 8px;
    }

    .results {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }
    .result-toolbar {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .tabs {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--panel-soft);
    }
    .tab {
      height: 30px;
      border: none;
      border-radius: 5px;
      background: transparent;
      color: var(--muted);
      padding: 0 11px;
      font-weight: 700;
    }
    .tab.active {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 2px 8px rgba(15, 23, 42, .08);
    }
    .result-count {
      color: var(--muted);
      white-space: nowrap;
    }
    .result-list {
      min-height: 0;
      overflow: auto;
      padding: 10px;
      display: grid;
      align-content: start;
      gap: 10px;
      background: #f8fafc;
    }
    .field-card,
    .table-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 10px;
      cursor: pointer;
    }
    .field-card:hover,
    .table-card:hover,
    .field-card.active,
    .table-card.active {
      border-color: #9bbbf0;
      box-shadow: 0 8px 20px rgba(23, 105, 224, .08);
    }
    .card-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 10px;
      align-items: start;
    }
    .name-line {
      min-width: 0;
      display: flex;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .main-name {
      color: #111827;
      font-size: 15px;
      font-weight: 850;
    }
    .cn-name {
      color: var(--muted);
      font-weight: 650;
    }
    .path {
      margin-top: 4px;
      color: var(--faint);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .score {
      min-width: 62px;
      text-align: center;
      border-radius: 7px;
      padding: 5px 7px;
      background: var(--green-soft);
      color: var(--green);
      font-weight: 850;
    }
    .score.warn {
      background: var(--amber-soft);
      color: var(--amber);
    }
    .meta-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }
    .meta {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 7px 8px;
      background: #fbfcfe;
    }
    .meta-label {
      color: var(--faint);
      font-size: 12px;
    }
    .meta-value {
      margin-top: 2px;
      color: #344054;
      font-weight: 750;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .sample-values {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .reason-box,
    .verdict-box {
      border: 1px solid #bfd7ff;
      border-radius: 7px;
      background: var(--blue-soft);
      padding: 8px 10px;
      color: #1649b8;
      line-height: 1.5;
    }
    .verdict-box.good {
      border-color: #b7e4d2;
      background: var(--green-soft);
      color: var(--green);
    }
    .verdict-box.warn {
      border-color: #f6d28f;
      background: var(--amber-soft);
      color: var(--amber);
    }
    .reason-list {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .quality-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 7px;
    }
    .quality-mini {
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfe;
      padding: 7px;
    }
    .quality-mini span {
      display: block;
      color: var(--faint);
      font-size: 11px;
    }
    .quality-mini strong {
      display: block;
      margin-top: 2px;
      color: #344054;
      font-size: 13px;
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
      padding-top: 2px;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 24px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel-soft);
      color: #475467;
      white-space: nowrap;
    }
    .chip.sensitive {
      border-color: #fed7aa;
      background: var(--red-soft);
      color: var(--red);
    }
    .chip.good {
      border-color: #b7e4d2;
      background: var(--green-soft);
      color: var(--green);
    }
    .chip.blue {
      border-color: #bfd7ff;
      background: var(--blue-soft);
      color: var(--blue);
    }
    .chip.purple {
      border-color: #d6bbfb;
      background: var(--purple-soft);
      color: var(--purple);
    }

    .detail {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    .detail-body {
      min-height: 0;
      overflow: auto;
      padding: 12px;
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .detail-title {
      min-width: 0;
      display: grid;
      gap: 3px;
    }
    .detail-title strong {
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .detail-title span {
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .detail-section {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .section-head {
      min-height: 38px;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .section-body {
      padding: 10px;
      display: grid;
      gap: 10px;
    }
    .kv-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .kv {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      background: var(--panel-soft);
    }
    .kv span {
      display: block;
      color: var(--faint);
      font-size: 12px;
    }
    .kv strong {
      display: block;
      margin-top: 3px;
      color: #344054;
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .quality-row {
      display: grid;
      grid-template-columns: 78px minmax(0, 1fr) 46px;
      gap: 8px;
      align-items: center;
      min-height: 28px;
    }
    .bar {
      height: 8px;
      border-radius: 999px;
      background: #edf2f7;
      overflow: hidden;
    }
    .bar > i {
      display: block;
      height: 100%;
      width: var(--w);
      background: var(--c, var(--blue));
      border-radius: inherit;
    }
    .mini-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      font-size: 12px;
    }
    .mini-table th,
    .mini-table td {
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      padding: 7px 8px;
      text-align: left;
      white-space: nowrap;
    }
    .mini-table th {
      background: #f1f5f9;
      color: #344054;
      font-weight: 800;
    }
    .mini-table th:first-child,
    .mini-table td:first-child { border-left: 1px solid var(--line); }
    .mini-table tr:first-child th { border-top: 1px solid var(--line); }
    .mini-table th:first-child { border-top-left-radius: 6px; }
    .mini-table th:last-child { border-top-right-radius: 6px; }
    .preview-wrap {
      overflow: auto;
      max-height: 210px;
    }
    .masked {
      color: var(--red);
      background: var(--red-soft);
      border-radius: 4px;
      padding: 1px 4px;
    }
    .dist {
      display: grid;
      gap: 8px;
    }
    .dist-row {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr) 42px;
      gap: 8px;
      align-items: center;
    }
    .same-field {
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 8px;
      display: grid;
      gap: 4px;
      background: #fff;
    }
    .same-field strong {
      color: #344054;
    }
    .same-field span {
      color: var(--faint);
    }
    .action-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }
    .action-card {
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px;
      background: #fff;
      color: #344054;
      text-align: left;
    }
    .action-card strong {
      display: block;
      margin-bottom: 3px;
    }
    .action-card span {
      color: var(--faint);
      font-size: 12px;
      line-height: 1.4;
    }
    .drawer-mask {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, .28);
      display: none;
      z-index: 30;
    }
    .drawer-mask.open { display: block; }
    .compare-drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: 760px;
      max-width: 92vw;
      height: 100vh;
      background: #fff;
      box-shadow: -18px 0 36px rgba(15, 23, 42, .18);
      display: grid;
      grid-template-rows: 58px minmax(0, 1fr);
      z-index: 31;
      transform: translateX(100%);
      transition: transform .18s ease;
    }
    .compare-drawer.open { transform: translateX(0); }
    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #fbfcfe;
    }
    .drawer-title {
      font-weight: 850;
      font-size: 15px;
    }
    .drawer-body {
      min-height: 0;
      overflow: auto;
      padding: 14px;
      display: grid;
      gap: 12px;
      align-content: start;
    }
    .compare-note {
      border: 1px solid #b7e4d2;
      border-radius: 8px;
      background: var(--green-soft);
      color: var(--green);
      padding: 10px;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }
    .btn {
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: #344054;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }
    .btn.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
      font-weight: 750;
    }
    .btn.ghost {
      background: var(--panel-soft);
    }
    .field-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .field-tools input {
      flex: 1;
      min-width: 0;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0 8px;
    }
    .hide { display: none !important; }

    @media (max-width: 1280px) {
      .search-hero { grid-template-columns: 1fr; }
      .workbench { grid-template-columns: 240px minmax(0, 1fr); }
      .detail-panel { display: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">DF</div><span>DataFlow</span></div>
      <nav class="nav">
        <div class="nav-item"><span class="nav-ico"></span>首页</div>
        <div class="nav-item"><span class="nav-ico"></span>同步任务</div>
        <div class="nav-item active"><span class="nav-ico"></span>数据探查</div>
        <div class="nav-item"><span class="nav-ico"></span>主题库</div>
        <div class="nav-item"><span class="nav-ico"></span>数据治理</div>
        <div class="nav-item"><span class="nav-ico"></span>Magic API</div>
        <div class="nav-item"><span class="nav-ico"></span>数据回传</div>
      </nav>
      <div class="user">admin</div>
    </header>

    <main class="page">
      <section class="search-hero">
        <div>
          <h1 class="hero-title">数据探查</h1>
          <div class="search-box">
            <div class="search-icon">⌕</div>
            <input id="searchInput" value="身份证" placeholder="搜索表名、字段名、字段中文名、字段描述、库名、数据源" />
            <button id="searchBtn">搜索</button>
          </div>
          <div class="quick-words">
            <span>常搜：</span>
            <span class="quick-word" data-word="客户号">客户号</span>
            <span class="quick-word" data-word="身份证">身份证</span>
            <span class="quick-word" data-word="交易金额">交易金额</span>
            <span class="quick-word" data-word="登录 IP">登录 IP</span>
            <span class="quick-word" data-word="手机号">手机号</span>
          </div>
        </div>
        <div class="hero-metrics">
          <div class="metric-card"><div class="metric-num">12,684</div><div class="metric-label">可检索字段</div></div>
          <div class="metric-card"><div class="metric-num">1,236</div><div class="metric-label">可探查数据表</div></div>
          <div class="metric-card"><div class="metric-num">96.4%</div><div class="metric-label">近 7 日更新正常</div></div>
          <div class="metric-card"><div class="metric-num">38</div><div class="metric-label">敏感字段已脱敏</div></div>
        </div>
      </section>

      <section class="workbench">
        <aside class="panel">
          <div class="panel-head"><span class="panel-title">筛选</span><button class="btn ghost" id="resetFilter">重置</button></div>
          <div class="panel-body filters">
            <div class="filter-group">
              <div class="filter-title">数据源</div>
              <label class="check-row"><input type="checkbox" checked /> MySQL 业务库</label>
              <label class="check-row"><input type="checkbox" checked /> Oracle 警综库</label>
              <label class="check-row"><input type="checkbox" /> Doris 明细库</label>
              <label class="check-row"><input type="checkbox" /> Hive 离线库</label>
            </div>
            <div class="filter-group">
              <div class="filter-title">库名</div>
              <select class="mini-select">
                <option>全部库</option>
                <option>ods_case</option>
                <option>dwd_trade</option>
                <option>c3_return</option>
              </select>
            </div>
            <div class="filter-group">
              <div class="filter-title">字段类型</div>

              <tr><td>AJ20260518002</td><td>李某</td><td><span class="masked">320***********8842</span></td><td><span class="masked">151****9077</span></td></tr>
              <tr><td>AJ20260518003</td><td>王某</td><td><span class="masked">440***********2419</span></td><td><span class="masked">186****1209</span></td></tr>
            </table>
          </div>
        </section>
        <section class="detail-section">
          <div class="section-head">下一步动作</div>
          <div class="section-body action-grid">
            <button class="action-card"><strong>进入数据预览</strong><span>查看前 50/100 行数据并继续筛选</span></button>
            <button class="action-card"><strong>复制表路径</strong><span>${t.db}.${t.name}</span></button>
            <button class="action-card"><strong>生成查询 SQL</strong><span>生成 SELECT 字段清单和 LIMIT 100</span></button>
            <button class="action-card"><strong>申请明文权限</strong><span>对敏感字段发起授权申请</span></button>
          </div>
        </section>
      `
    }

    function openCompare(seedField) {
      const rows = fieldData
        .filter(item => item.cn.includes(seedField.cn.slice(0, 2)) || item.same.join('|').includes(seedField.name) || item.sensitive === seedField.sensitive)
        .slice(0, 4)
      compareBody.innerHTML = `
        <div class="compare-note">
          推荐优先使用 <strong>${seedField.db}.${seedField.table}.${seedField.name}</strong>。
          原因是命中解释清楚、更新时间近、空值率低，并且权限边界可说明。
        </div>
        <section class="detail-section">
          <div class="section-head">字段选择对比</div>
          <div class="section-body preview-wrap">
            <table class="mini-table">
              <tr>
                <th>字段路径</th>
                <th>中文含义</th>
                <th>空值率</th>
                <th>唯一值</th>
                <th>更新时间</th>
                <th>权限</th>
                <th>结论</th>
              </tr>
              ${rows.map(item => `
                <tr>
                  <td>${item.db}.${item.table}.${item.name}</td>
                  <td>${item.cn}</td>
                  <td>${item.nullRate}</td>
                  <td>${item.unique}</td>
                  <td>${item.updated}</td>
                  <td>${item.sensitive ? '脱敏预览' : '明文可见'}</td>
                  <td>${item.verdict}</td>
                </tr>
              `).join('')}
            </table>
          </div>
        </section>
        <section class="detail-section">
          <div class="section-head">选择建议</div>
          <div class="section-body">
            <div class="same-field"><strong>查案件嫌疑人</strong><span>优先选 ods_case.case_suspect.person_idcard，案件关联更直接。</span></div>
            <div class="same-field"><strong>查人口基础信息</strong><span>优先选 ods_population.population_person.id_card_no，覆盖范围更大。</span></div>
            <div class="same-field"><strong>做统计分析</strong><span>优先选空值率低、更新时间近、唯一值稳定的字段。</span></div>
          </div>
        </section>
      `
      drawerMask.classList.add('open')
      compareDrawer.classList.add('open')
    }

    function closeCompare() {
      drawerMask.classList.remove('open')
      compareDrawer.classList.remove('open')
    }

    function bind() {
      document.querySelectorAll('[data-tab]').forEach(btn => {
        btn.addEventListener('click', () => {
          currentTab = btn.dataset.tab
          document.querySelectorAll('[data-tab]').forEach(item => item.classList.toggle('active', item === btn))
          fieldResults.classList.toggle('hide', currentTab !== 'fields')
          tableResults.classList.toggle('hide', currentTab !== 'tables')
          document.getElementById('resultSummary').textContent = currentTab === 'fields'
            ? `搜索“${document.getElementById('searchInput').value}”，优先展示字段命中`
            : `搜索“${document.getElementById('searchInput').value}”，展示相关数据表`
          currentTab === 'fields' ? fieldDetail(activeField) : tableDetail(activeTable)
          renderFieldCards()
          renderTableCards()
        })
      })

      fieldResults.addEventListener('click', (event) => {
        const compareButton = event.target.closest('[data-compare]')
        if (compareButton) {
          event.stopPropagation()
          openCompare(fieldData[Number(compareButton.dataset.compare)])
          return
        }
        const copyButton = event.target.closest('[data-copy-path]')
        if (copyButton) {
          event.stopPropagation()
          document.getElementById('resultSummary').textContent = `已复制字段路径：${copyButton.dataset.copyPath}`
          return
        }
        const card = event.target.closest('[data-field]')
        if (!card) return
        activeField = fieldData[Number(card.dataset.field)]
        currentTab = 'fields'
        renderFieldCards()
        fieldDetail(activeField)
      })

      tableResults.addEventListener('click', (event) => {
        const card = event.target.closest('[data-table]')
        if (!card) return
        activeTable = tableData[Number(card.dataset.table)]
        currentTab = 'tables'
        renderTableCards()
        tableDetail(activeTable)
      })

      document.querySelectorAll('.quick-word').forEach(item => {
        item.addEventListener('click', () => {
          document.getElementById('searchInput').value = item.dataset.word
          document.getElementById('resultSummary').textContent = `搜索“${item.dataset.word}”，优先展示字段命中`
        })
      })

      document.getElementById('searchBtn').addEventListener('click', () => {
        const word = document.getElementById('searchInput').value || '身份证'
        document.getElementById('resultSummary').textContent = currentTab === 'fields'
          ? `搜索“${word}”，优先展示字段命中`
          : `搜索“${word}”，展示相关数据表`
      })

      document.getElementById('openTableBtn').addEventListener('click', () => {
        currentTab = 'tables'
        document.querySelector('[data-tab="tables"]').click()
        activeTable = tableData.find(t => t.name === activeField.table) || tableData[0]
        renderTableCards()
        tableDetail(activeTable)
      })

      document.getElementById('closeCompare').addEventListener('click', closeCompare)
      drawerMask.addEventListener('click', closeCompare)
    }

    renderFieldCards()
    renderTableCards()
    fieldDetail(activeField)
    bind()
  </script>
</body>
</html>
