<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>同步任务 - 第2步 配置同步方案原型</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --panel:#fff;
      --line:#d9e2ef;
      --line2:#e5ebf4;
      --text:#1f2937;
      --subtle:#667085;
      --muted:#98a2b3;
      --primary:#2f6bff;
      --primary-soft:rgba(47,107,255,.1);
      --success:#12836a;
      --warn:#c87d00;
      --danger:#c63b5d;
      --shadow:0 14px 32px rgba(25,40,74,.08);
      --radius:10px;
      --radius-sm:8px;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      font-size:13px;
    }
    .page{min-height:100vh;padding:18px}
    .shell{max-width:1720px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
    .topbar,.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .topbar{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:16px}
    .title{font-size:16px;font-weight:700}
    .subtitle{margin-top:4px;color:var(--subtle);font-size:12px;line-height:1.5}
    .steps{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
    .step{display:inline-flex;align-items:center;height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:#fff;white-space:nowrap;color:var(--subtle)}
    .step.current{background:var(--primary-soft);color:var(--primary);border-color:rgba(47,107,255,.25);font-weight:700}
    .summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;padding:12px}
    .summary-item{border:1px solid var(--line2);background:#fbfcff;border-radius:var(--radius-sm);padding:10px 11px;min-width:0}
    .summary-item span{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
    .summary-item strong{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .main{display:grid;grid-template-columns:280px minmax(0,1fr);gap:12px;align-items:stretch}
    .side,.content{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
    .side{padding:12px;display:flex;flex-direction:column;gap:10px}
    .content{padding:14px;display:flex;flex-direction:column;gap:12px}
    .panel-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .panel-title{font-size:15px;font-weight:700}
    .panel-desc{margin-top:4px;color:var(--subtle);font-size:12px;line-height:1.5}
    .chip{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;font-size:12px;white-space:nowrap;border:1px solid transparent}
    .chip.good{background:#eafaf3;color:var(--success);border-color:#ccefe0}
    .chip.warn{background:#fff5e6;color:var(--warn);border-color:#ffe0a8}
    .cardbox{border:1px solid var(--line2);border-radius:10px;background:#f9fbff;padding:12px;display:flex;flex-direction:column;gap:10px}
    .section-title{font-weight:700}
    .section-tip{margin-top:4px;color:var(--subtle);font-size:12px;line-height:1.5}
    .module-list{display:flex;flex-direction:column;gap:8px}
    .module-item{border:1px solid var(--line2);border-radius:10px;background:#fff;padding:10px 11px;cursor:pointer}
    .module-item.active{border-color:rgba(47,107,255,.35);background:linear-gradient(180deg,#f6f9ff,#eef4ff)}
    .module-top{display:flex;justify-content:space-between;gap:10px;align-items:center}
    .module-name{font-weight:700}
    .module-badges{display:none}
    .badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;background:#f3f6fb;color:#475467;font-size:11px;border:1px solid #e3e9f4}
    .badge.primary{background:#eef4ff;color:var(--primary);border-color:#d8e4ff}
    .badge.green{background:#ecfdf5;color:var(--success);border-color:#ccf0df}
    .badge.orange{background:#fff7e6;color:var(--warn);border-color:#ffe2b0}
    .mini-toolbar{display:flex;gap:8px;flex-wrap:wrap}
    .btn{height:32px;border:1px solid #d8e0ec;background:#fff;border-radius:8px;padding:0 11px;cursor:pointer;color:#344054;font:inherit;white-space:nowrap}
    .btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
    .btn.ghost{background:#f7f9fc}
    .btn:disabled{cursor:not-allowed;background:#f1f4f8;color:var(--muted)}
    .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    .grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .field{display:flex;flex-direction:column;gap:6px;min-width:0}
    .field.full{grid-column:span 2}
    .field.full3{grid-column:span 3}
    label{color:var(--subtle);font-weight:600;font-size:12px}
    select,input,textarea{
      width:100%;height:34px;border:1px solid #d8e0ec;border-radius:8px;padding:0 10px;background:#fff;color:var(--text);outline:none;font:inherit
    }
    textarea{height:78px;padding:9px 10px;resize:none;line-height:1.55}
    textarea.sql-template{height:168px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.6}
    select:focus,input:focus,textarea:focus{border-color:#7aa2ff;box-shadow:0 0 0 3px rgba(47,107,255,.1)}
    .statgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
    .stat{border:1px solid var(--line2);background:#fbfcff;border-radius:var(--radius-sm);padding:9px 10px;min-width:0}
    .stat span{display:block;font-size:11px;color:var(--muted)}
    .stat strong{display:block;margin-top:4px;font-size:15px}
    .stack{display:flex;flex-direction:column;gap:10px}
    .block{border:1px solid var(--line2);border-radius:10px;background:#fff;padding:12px;display:flex;flex-direction:column;gap:10px}
    .block-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .block-title{font-weight:700}
    .block-tip{margin-top:4px;color:var(--subtle);font-size:12px;line-height:1.5}
    .block-list{display:flex;flex-direction:column;gap:8px}
    .filter-row{display:grid;grid-template-columns:40px minmax(140px,1.1fr) minmax(120px,.9fr) minmax(160px,1.25fr) 78px 78px;gap:8px;align-items:center}
    .toggle{height:24px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;user-select:none;background:var(--primary);color:#fff}
    .toggle.off{background:#d5dbe7;color:#5b6475}
    .sql-panel{border:1px solid #22304a;background:#0f172a;border-radius:10px;overflow:hidden}
    .sql-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 10px;background:#172033;color:#d7e0ef;font-size:12px}
    pre{margin:0;padding:12px 14px;color:#dbe6fa;line-height:1.68;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;white-space:pre-wrap;overflow:auto}
    .kw{color:#c586c0}.where{color:#9cdcfe}.string{color:#ce9178}
    .hint{font-size:11px;color:var(--muted);line-height:1.5}
    .preview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .preview{border:1px solid #e7edf6;background:#fbfcff;border-radius:8px;padding:9px 10px}
    .preview span{display:block;font-size:11px;color:var(--muted)}
    .preview strong{display:block;margin-top:4px;font-size:14px}
    .option-tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .option-tab{height:44px;border:1px solid #d8e0ec;background:#fff;border-radius:8px;padding:6px 10px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;color:#344054;text-align:left;cursor:pointer;font:inherit;min-width:0}
    .option-tab.active{border-color:rgba(47,107,255,.35);background:var(--primary-soft);color:var(--primary);font-weight:700}
    .option-tab strong{font-size:12px;line-height:1.2}
    .option-tab span{margin-top:2px;font-size:11px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
    .sink-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line2);padding:0 2px}
    .sink-tab{height:34px;border:0;border-bottom:2px solid transparent;background:transparent;padding:0 10px;cursor:pointer;color:#475467;font:inherit;white-space:nowrap}
    .sink-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:700}
    .sink-tab-panel{border:1px solid var(--line2);border-top:0;border-radius:0 0 10px 10px;background:#fff;padding:12px;display:flex;flex-direction:column;gap:10px}
    .sink-section{border:1px solid var(--line2);border-radius:10px;background:#fff;padding:12px;display:flex;flex-direction:column;gap:10px}
    .sink-section-title{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:700}
    .notice{border:1px solid #d8e4ff;background:#f6f9ff;border-radius:10px;padding:10px 12px;color:#344054;line-height:1.55}
    .notice.warn{border-color:#ffe0a8;background:#fff8ec;color:#704d16}
    .notice.danger{border-color:#ffd5e1;background:#fff5f7;color:#9f1239}
    .field-note{color:var(--muted);font-size:11px;line-height:1.45}
    .label-help{display:inline-flex;align-items:center;gap:5px;position:relative;width:max-content}
    .help-icon{width:16px;height:16px;border-radius:50%;border:1px solid #b9c7dd;color:#667085;background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;cursor:help}
    .help-popover{position:absolute;left:0;top:22px;z-index:20;width:420px;border:1px solid #cbd8ea;border-radius:8px;background:#fff;box-shadow:0 12px 28px rgba(25,40,74,.16);padding:10px 12px;color:#344054;line-height:1.55;display:none;font-weight:400}
    .help-popover div+div{margin-top:6px}
    .help-popover strong{color:#1f2937}
    .label-help:hover .help-popover,
    .label-help:focus-within .help-popover{display:block}
    .field.is-disabled input,
    .field.is-disabled select,
    .field.is-disabled textarea{background:#f1f4f8;color:#98a2b3;cursor:not-allowed}
    .hidden{display:none!important}
    .map-shell{border:1px solid var(--line2);border-radius:10px;background:#f9fbff;padding:12px;display:flex;flex-direction:column;gap:10px}
    .map-toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
    .map-toolbar-left{display:flex;gap:8px;flex-wrap:wrap}
    .map-board{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;min-height:420px;padding:8px 0}
    .map-lines{position:absolute;inset:0;pointer-events:none;z-index:1}
    .map-column{position:relative;z-index:2;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:10px}
    .map-col-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .map-list{display:flex;flex-direction:column;gap:8px}
    .map-row{display:grid;grid-template-columns: 1fr 1.1fr 1fr;gap:8px;align-items:center;border:1px solid #e7edf6;background:#fbfcff;border-radius:8px;padding:8px 10px;min-width:0}
    .map-row.target{grid-template-columns: 1.15fr .9fr 72px 72px 34px}
    .field-main{display:flex;flex-direction:column;gap:4px;min-width:0}
    .field-name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .field-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--muted)}
    .field-comment,.field-sub{font-size:11px;color:var(--subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .field-types,.field-badges{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .type-tag,.state-tag{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:999px;font-size:11px;border:1px solid #e3e9f4;background:#f3f6fb;color:#475467}
    .state-tag.pk{background:#ecfdf5;color:var(--success);border-color:#ccf0df}
    .state-tag.null{background:#fff7e6;color:var(--warn);border-color:#ffe2b0}
    .state-tag.nn{background:#eff4ff;color:var(--primary);border-color:#d8e4ff}
    .node-dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--primary);background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 0 3px rgba(47,107,255,.08);justify-self:end}
    .node-dot.right{justify-self:start}
    .node-dot::after{content:'';width:6px;height:6px;border-radius:50%;background:var(--primary)}
    .node-dot.selected{background:var(--primary-soft)}
    .map-row.connected{border-color:#bfd0ff;background:#f5f8ff}
    .map-row.unmapped{border-style:dashed}
    .map-row.manual .state-tag.pk{background:#fff0f4;color:var(--danger);border-color:#ffd5e1}
    .map-row.manual .state-tag.null{background:#eef2ff;color:#4f46e5;border-color:#d8ddff}
    .map-row.manual .state-tag.nn{background:#ecfdf5;color:var(--success);border-color:#ccf0df}
    .mapping-v4-wrap{border:1px solid var(--line2);border-radius:10px;background:#fff;overflow:hidden}
    .mapping-v4-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line2);background:#f9fbff}
    .line-legend{display:flex;align-items:center;gap:12px;color:var(--subtle);font-size:12px;flex-wrap:wrap}
    .legend-item{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
    .legend-line{width:32px;height:0;border-top:2px solid #7ba2ff;display:inline-block}
    .legend-line.auto{border-top-style:dashed}
    .legend-line.manual{border-top-style:solid;border-top-color:#2f6bff}
    .mapping-v4-mount{min-height:860px;background:#fff}
    .mapping-v4-error{padding:14px;border:1px solid #ffd5e1;border-radius:8px;background:#fff0f4;color:#b4233f}
  </style>
</head>
<body>
<div class="page">
  <div class="shell">
    <div class="topbar">
      <div>
        <div class="title">同步任务 · 第 2 步：配置同步方案原型</div>
        <div class="subtitle">参考 DataWorks 的分区方式，将第 2 步拆成多个功能块：字段映射关系、数据去向、源端过滤条件、数据处理。</div>
      </div>
      <div class="steps">
        <span class="step">1 选择源与目标</span>
        <span class="step current">2 配置同步方案</span>
        <span class="step">3 执行与调度</span>
        <span class="step">4 预览与发布</span>
      </div>
    </div>

    <div class="card summary">
      <div class="summary-item"><span>项目</span><strong>test1</strong></div>
      <div class="summary-item"><span>源端连接</span><strong>mysql_case_workbench</strong></div>
      <div class="summary-item"><span>源表</span><strong>case_workbench.ajxx_tab</strong></div>
      <div class="summary-item"><span>目标端连接</span><strong>doris_fe_mysql</strong></div>
      <div class="summary-item"><span>目标端类型</span><strong>Doris</strong></div>
      <div class="summary-item"><span>同步方案</span><strong id="summaryText">4 个模块</strong></div>
    </div>

    <div class="main">
      <aside class="side">
        <div class="panel-head">
          <div>
            <div class="panel-title">同步方案模块</div>
            <div class="panel-desc">左侧选择模块，右侧显示当前模块的配置内容。</div>
          </div>
          <span class="chip good">第2步</span>
        </div>
        <div class="module-list" id="moduleList"></div>
      </aside>

      <section class="content">
        <div class="panel-head">
          <div>
            <div class="panel-title" id="moduleTitle">数据处理</div>
            <div class="panel-desc" id="moduleDesc">支持字符串替换、AI 辅助处理、数据向量化等处理方式，处理后写入目标表。</div>
          </div>
          <span class="chip" id="moduleChip">可启用</span>
        </div>

        <div id="moduleBody"></div>
      </section>
    </div>
  </div>
</div>

<script>
  const modules = [
    {
      id: 'mapping',
      name: '字段映射关系',
      desc: '配置源字段与目标字段的映射、主键、可空与类型兼容。',
      chip: '核心步骤',
      type: 'panel',
      body: `
        <div class="mapping-v4-wrap">
          <div class="mapping-v4-head">
            <div>
              <div class="section-title">字段映射工作台</div>
              <div class="section-tip">复用 V4 版双栏字段映射原型：源字段圆点、目标字段圆点、拖拽连线、主键/可空状态保持一致。</div>
            </div>
            <div class="line-legend">
              <span class="legend-item"><span class="legend-line auto"></span>虚线：系统自动映射</span>
              <span class="legend-item"><span class="legend-line manual"></span>实线：手动拖拽映射</span>
            </div>
          </div>
          <div class="mapping-v4-mount" id="mappingV4Mount"></div>
        </div>
      `
    },
    {
      id: 'sink',
      name: '数据去向',
      desc: '配置目标端写入方式。目标端数据源类型为 Doris 时，展示 Doris Stream Load Sink 选项。',
      chip: 'Doris',
      type: 'panel',
      body: `
        <div id="dorisSinkWorkbench"></div>
      `
    },
    {
      id: 'filter',
      name: '源端过滤条件',
      desc: '在读取阶段拼接 WHERE 条件、时间范围和前 N 条限制。',
      chip: '可配置',
      type: 'filter',
      body: `
        <div class="block">
          <div class="block-head">
            <div>
              <div class="block-title">源端过滤条件</div>
              <div class="block-tip">结构化条件进入 source query，不开放自由 SQL；最多 3 条，默认 AND 拼接。</div>
            </div>
            <span class="chip good" id="filterState">已启用</span>
          </div>
          <div class="stack" id="filterRows"></div>
          <div class="mini-toolbar">
            <button class="btn primary" id="addFilter">添加条件</button>
            <button class="btn ghost" id="previewRows">预估影响行数</button>
            <button class="btn" id="clearFilter">清空全部</button>
          </div>
          <div class="preview-grid">
            <div class="preview"><span>预计读取</span><strong id="estimateRows">-</strong></div>
            <div class="preview"><span>条件数量</span><strong id="filterCount">2</strong></div>
            <div class="preview"><span>预估状态</span><strong id="estimateState">未预估</strong></div>
          </div>
          <div class="sql-panel">
            <div class="sql-head">
              <span>Source Query 预览</span>
              <button class="btn" id="copySql" style="height:24px;">复制 SQL</button>
            </div>
            <pre id="sqlText"></pre>
          </div>
        </div>
      `
    },
    {
      id: 'processing',
      name: '数据处理',
      desc: '支持字符串替换、AI 辅助处理、数据向量化等处理方式，处理后写入目标表。',
      chip: '暂未实现',
      type: 'panel',
      body: `
        <div class="cardbox">
          <div class="block-head">
            <div>
              <div class="section-title">数据处理</div>
              <div class="section-tip">该模块能力复杂，当前仅保留入口和产品位置，暂不进入实现。</div>
            </div>
            <span class="chip warn">暂未实现</span>
          </div>
          <div class="grid2">
            <div class="field">
              <label>处理方式</label>
              <select>
                <option>字符串替换</option>
                <option>AI 辅助处理</option>
                <option>数据向量化</option>
              </select>
            </div>
            <div class="field">
              <label>处理名称</label>
              <input value="暂未开放" disabled />
            </div>
            <div class="field full">
              <label>处理说明</label>
              <textarea disabled>后续再扩展字符串替换、AI 辅助处理、数据向量化等能力；本期只保留模块位置。</textarea>
            </div>
          </div>
          <div class="preview-grid">
            <div class="preview"><span>已配置项</span><strong>1 条</strong></div>
            <div class="preview"><span>处理耗时</span><strong>低</strong></div>
            <div class="preview"><span>是否影响结构</span><strong>否</strong></div>
          </div>
        </div>
      `
    },
  ];

  const fieldOptions = [
    { value:'status', label:'status · 状态', type:'string' },
    { value:'ajbh', label:'ajbh · 案件编号', type:'string' },
    { value:'ajmc', label:'ajmc · 案件名称', type:'string' },
    { value:'create_time', label:'create_time · 创建时间', type:'time' },
    { value:'update_time', label:'update_time · 更新时间', type:'time' },
    { value:'id', label:'id · 主键', type:'number' }
  ];
  const ops = {

  const typeOf = field => (fieldOptions.find(f => f.value === field) || {}).type || 'string';
  const quoteValue = (field, value) => typeOf(field) === 'number' ? (value || '0') : `'${String(value ?? '').replaceAll("'", "''")}'`;
  const clause = row => {
    if (!row.enabled || !row.field) return '';
    const field = `\`${row.field}\``;
    switch (row.op) {
      case 'EQ': return `${field} = ${quoteValue(row.field, row.value)}`;
      case 'NE': return `${field} <> ${quoteValue(row.field, row.value)}`;
      case 'GT': return `${field} > ${quoteValue(row.field, row.value)}`;
      case 'LT': return `${field} < ${quoteValue(row.field, row.value)}`;
      case 'GTE': return `${field} >= ${quoteValue(row.field, row.value)}`;
      case 'LTE': return `${field} <= ${quoteValue(row.field, row.value)}`;
      case 'CONTAINS': return `${field} LIKE '%${String(row.value).replaceAll("'", "''")}%'`;
      case 'PREFIX': return `${field} LIKE '${String(row.value).replaceAll("'", "''")}%'`;
      case 'IN': return `${field} IN (${String(row.value).split(',').map(v => quoteValue(row.field, v.trim())).join(', ')})`;
      case 'BETWEEN': return `${field} BETWEEN ${quoteValue(row.field, row.value)} AND ${quoteValue(row.field, row.valueEnd)}`;
      case 'IS_NULL': return `${field} IS NULL`;
      case 'NOT_NULL': return `${field} IS NOT NULL`;
      default: return '';

  };

  function buildPropertiesBlock(value, indent = '      '){
    const rows = String(value || '').split('\n').map(line => line.trim()).filter(Boolean);
    if (!rows.length) return [];
    const lines = ['    properties = {'];
    rows.forEach(row => {
      const eq = row.indexOf('=');
      const key = eq >= 0 ? row.slice(0, eq).trim() : row;
      const val = eq >= 0 ? row.slice(eq + 1).trim() : '';
      lines.push(`${indent}${key} = "${val.replaceAll('"', '\\"')}"`);
    });
    lines.push('    }');
    return lines;
  }

      `    max_commit_attempts = ${d.maxCommitAttempts}`,

        <div class="sink-section-title"><span>吞吐与事务</span><span class="badge">JDBC 共有属性</span></div>
        <div class="grid3">
          <div class="field"><label>批量行数（batch_size）</label><input data-jdbc="batchSize" value="${escapeHtml(d.batchSize)}" /></div>
          <div class="field ${target === 'oracle' ? '' : 'hidden'}"><label class="label-help">批量间隔（batch_interval_ms）<span class="help-icon" tabindex="0">!</span><span class="help-popover">Oracle Sink 支持按时间间隔触发批量提交，适合低频写入时避免长时间不落库。</span></label><input data-jdbc="batchIntervalMs" value="${escapeHtml(d.batchIntervalMs || '')}" /></div>
          <div class="field"><label>最大重试次数（max_retries）</label><input data-jdbc="maxRetries" value="${escapeHtml(d.maxRetries)}" /></div>
          <div class="field"><label>连接检查超时秒数</label><input data-jdbc="connectionCheckTimeoutSec" value="${escapeHtml(d.connectionCheckTimeoutSec)}" /></div>
          <div class="field"><label class="label-help">Exactly Once<span class="help-icon" tabindex="0">!</span><span class="help-popover">开启后依赖 XA 数据源和两阶段提交；演示环境可关闭，生产关键链路再按数据库能力启用。</span></label><select data-jdbc="isExactlyOnce">${boolOptions(d.isExactlyOnce)}</select></div>
          <div class="field"><label>自动提交（auto_commit）</label><select data-jdbc="autoCommit">${boolOptions(d.autoCommit)}</select></div>
          <div class="field full3 ${exactOnceActive ? '' : 'is-disabled'}"><label class="label-help">XA 数据源类<span class="help-icon" tabindex="0">!</span><span class="help-popover">${target === 'mysql' ? 'MySQL 常用 com.mysql.cj.jdbc.MysqlXADataSource。' : 'Oracle 常用 oracle.jdbc.xa.client.OracleXADataSource。'}只有开启 Exactly Once 时才真正需要。</span></label><input data-jdbc="xaDataSourceClassName" value="${escapeHtml(d.xaDataSourceClassName)}" ${exactOnceActive ? '' : 'disabled'} /></div>
          <div class="field ${exactOnceActive ? '' : 'is-disabled'}"><label>最大提交尝试次数</label><input data-jdbc="maxCommitAttempts" value="${escapeHtml(d.maxCommitAttempts)}" ${exactOnceActive ? '' : 'disabled'} /></div>
          <div class="field ${exactOnceActive ? '' : 'is-disabled'}"><label>事务超时秒数</label><input data-jdbc="transactionTimeoutSec" value="${escapeHtml(d.transactionTimeoutSec)}" ${exactOnceActive ? '' : 'disabled'} /></div>
        </div>
      `,
      properties: `
        <div class="sink-section-title"><span>JDBC 扩展参数</span><span class="badge">properties</span></div>
        <div class="grid2">
          <div class="field full"><label class="label-help">连接属性（properties）<span class="help-icon" tabindex="0">!</span><span class="help-popover">${target === 'mysql' ? '按 key=value 每行填写。MySQL 可放 rewriteBatchedStatements、useServerPrepStmts 等驱动参数。' : '按 key=value 每行填写。Oracle 可放 oracle.jdbc.timezoneAsRegion 等驱动参数。'}</span></label><textarea data-jdbc="properties">${escapeHtml(d.properties)}</textarea></div>
        </div>
      `
    };

    mount.innerHTML = `
      <div class="cardbox" data-testid="jdbc-sink-workbench">
        ${renderTargetSelector()}
        <div class="sink-tabs" role="tablist" aria-label="${targetLabel} Sink 配置分组">
          ${tabs.map(tab => `<button class="sink-tab ${state.jdbcTab === tab.id ? 'active' : ''}" data-jdbc-tab="${tab.id}" type="button">${tab.label}</button>`).join('')}
        </div>
        <div class="sink-tab-panel" data-testid="sink-tab-panel">${tabBodies[state.jdbcTab]}</div>
        <div class="sql-panel">
          <div class="sql-head"><span>${targetLabel} Sink 配置预览</span><button class="btn" id="copyJdbcConfig" style="height:24px;">复制配置</button></div>
          <pre id="jdbcConfigText">${escapeHtml(buildJdbcConfigText())}</pre>
        </div>
      </div>
    `;

    mount.querySelectorAll('[data-sink-target]').forEach(btn => {
      btn.onclick = () => {
        state.sinkTarget = btn.dataset.sinkTarget;
        render();
      };
    });
    mount.querySelectorAll('[data-jdbc-tab]').forEach(btn => {
      btn.onclick = () => {
        state.jdbcTab = btn.dataset.jdbcTab;
        render();
      };
    });
    mount.querySelectorAll('[data-jdbc]').forEach(el => {
      const updateState = () => { currentJdbcSink()[el.dataset.jdbc] = el.value; };
      if (el.tagName === 'SELECT') {
        el.onchange = () => { updateState(); render(); };
        return;
      }
      el.oninput = () => {
        updateState();
        const config = document.getElementById('jdbcConfigText');
        if (config) config.textContent = buildJdbcConfigText();
      };
      el.onchange = () => { updateState(); render(); };
    });
    const copy = document.getElementById('copyJdbcConfig');
    if (copy) {
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(buildJdbcConfigText());
          pulse(`${targetLabel} 配置已复制`);
        } catch {
          pulse('复制失败，请手动复制');
        }
      };
    }
  }

  function renderDorisSink(){
    const mount = document.getElementById('dorisSinkWorkbench');
    if (!mount) return;
    if (state.sinkTarget !== 'doris') {
      renderJdbcSink(mount);
      return;
    }
    const d = state.dorisSink;
    const customSqlActive = d.dataSaveMode === 'CUSTOM_PROCESSING';
    const twoPcActive = d.enable2pc === 'true';
    const jsonMode = d.format === 'json';
    const tabs = [
      { id:'base', label:'基础写入配置' },
      { id:'mode', label:'写入模式' },
      { id:'throughput', label:'吞吐与提交' },
      { id:'template', label:'建表模板' },
      { id:'config', label:'doris.config 参数' }
    ];
    if (!tabs.some(tab => tab.id === state.dorisTab)) state.dorisTab = 'base';

    const tabBodies = {
      base: `
        <div class="sink-section-title"><span>基础写入配置</span><span class="badge primary">必填</span></div>
        <div class="grid3">
          <div class="field"><label>FE HTTP 地址（fenodes）</label><input data-doris="fenodes" value="${escapeHtml(d.fenodes)}" /><div class="field-note">多个 FE 用英文逗号分隔，必须是 HTTP 端口。</div></div>
          <div class="field"><label>FE MySQL 查询端口（query-port）</label><input data-doris="queryPort" value="${escapeHtml(d.queryPort)}" /></div>
          <div class="field"><label>数据库（database）</label><input data-doris="database" value="${escapeHtml(d.database)}" /></div>
          <div class="field"><label>目标表（table）</label><input data-doris="table" value="${escapeHtml(d.table)}" /></div>
          <div class="field"><label>用户名（username）</label><input data-doris="username" value="${escapeHtml(d.username)}" /></div>
          <div class="field"><label>密码（password）</label><input data-doris="password" value="${escapeHtml(d.password)}" /></div>
          <div class="field full3"><label>Label 前缀（sink.label-prefix）</label><input data-doris="labelPrefix" value="${escapeHtml(d.labelPrefix)}" /><div class="field-note">建议按任务编码生成并保持唯一，避免 Stream Load label 冲突。</div></div>
        </div>
      `,
      mode: `
        <div class="sink-section-title"><span>写入模式</span><span class="badge orange">影响数据覆盖</span></div>
        <div class="grid3">
          <div class="field"><label class="label-help">结构处理（schema_save_mode）<span class="help-icon" tabindex="0">?</span><span class="help-popover" data-testid="schema-mode-help"><div><strong>CREATE_SCHEMA_WHEN_NOT_EXIST：</strong>目标表不存在时自动建表，已存在时复用现有表结构。</div><div><strong>RECREATE_SCHEMA：</strong>每次执行前重建目标表，会删除原表结构和数据后再建表。</div><div><strong>ERROR_WHEN_SCHEMA_NOT_EXIST：</strong>目标表不存在就报错，不自动建表，适合生产库禁止任务改结构的场景。</div></span></label><select data-doris="schemaSaveMode">${selectOptions(['CREATE_SCHEMA_WHEN_NOT_EXIST','RECREATE_SCHEMA','ERROR_WHEN_SCHEMA_NOT_EXIST'], d.schemaSaveMode)}</select></div>
          <div class="field"><label class="label-help">数据处理（data_save_mode）<span class="help-icon" tabindex="0">?</span><span class="help-popover" data-testid="data-save-mode-help"><div><strong>APPEND_DATA：</strong>保留目标表原数据，直接追加本次同步数据。</div><div><strong>DROP_DATA：</strong>写入前清空目标表数据，再写入本次同步结果。</div><div><strong>ERROR_WHEN_DATA_EXISTS：</strong>目标表已有数据时直接报错，避免误覆盖或重复写入。</div><div><strong>CUSTOM_PROCESSING：</strong>执行自定义 custom_sql 后再写入，适合按分区、日期或业务条件清理旧数据。</div></span></label><select data-doris="dataSaveMode">${selectOptions(['APPEND_DATA','DROP_DATA','ERROR_WHEN_DATA_EXISTS','CUSTOM_PROCESSING'], d.dataSaveMode)}</select></div>
          <div class="field"><label>大小写敏感（case_sensitive）</label><select data-doris="caseSensitive">${boolOptions(d.caseSensitive)}</select></div>
          <div class="field"><label>分布式事务（sink.enable-2pc）</label><select data-doris="enable2pc">${boolOptions(d.enable2pc)}</select></div>
          <div class="field"><label>删除事件（sink.enable-delete）</label><select data-doris="enableDelete">${boolOptions(d.enableDelete)}</select></div>
          <div class="field"><label>不支持类型转换</label><select data-doris="needsUnsupportedTypeCasting">${boolOptions(d.needsUnsupportedTypeCasting)}</select></div>
        </div>
        <div class="${twoPcActive ? 'notice warn' : 'notice hidden'}" data-testid="two-pc-warning">2PC 开启后提交由 checkpoint 控制，sink.buffer-size 不生效。页面已将该项置灰，避免误以为行数阈值仍会触发提交。</div>
        <div class="field full3 ${customSqlActive ? '' : 'hidden'}" data-testid="custom-sql-field">
          <label>同步前 SQL（custom_sql）</label>
          <textarea data-doris="customSql">${escapeHtml(d.customSql)}</textarea>
          <div class="field-note">该 SQL 隶属于 data_save_mode = CUSTOM_PROCESSING，不属于建表模板配置。</div>
        </div>
      `,
      throughput: `
        <div class="sink-section-title"><span>吞吐与提交</span><span class="badge">高级</span></div>
        <div class="${twoPcActive ? 'notice warn' : 'notice hidden'}" data-testid="two-pc-warning">当前 2PC 开启，sink.buffer-size 不生效；切到“写入模式”关闭 2PC 后可编辑。</div>
        <div class="grid3">
          <div class="field ${twoPcActive ? 'is-disabled' : ''}" data-testid="buffer-size-field"><label>单批行数（sink.buffer-size）</label><input data-doris="bufferSize" value="${escapeHtml(d.bufferSize)}" ${twoPcActive ? 'disabled' : ''} /><div class="field-note">${twoPcActive ? '当前 2PC 开启，此项在配置预览中自动排除。' : '2PC 关闭时用于控制单批写入行数。'}</div></div>
          <div class="field"><label>缓冲区数量（sink.buffer-count）</label><input data-doris="bufferCount" value="${escapeHtml(d.bufferCount)}" /></div>
          <div class="field"><label>HTTP 批量行数（doris.batch.size）</label><input data-doris="batchSize" value="${escapeHtml(d.batchSize)}" /></div>
          <div class="field"><label>刷新间隔（sink.check-interval ms）</label><input data-doris="checkInterval" value="${escapeHtml(d.checkInterval)}" /></div>
          <div class="field"><label>最大重试次数（sink.max-retries）</label><input data-doris="maxRetries" value="${escapeHtml(d.maxRetries)}" /></div>
          <div class="field"><label>Stream Load 格式</label><select data-doris="format">${selectOptions(['json','csv'], d.format)}</select></div>
        </div>
      `,
      template: `
        <div class="sink-section-title"><span>建表模板</span><span class="badge">SaveMode</span></div>
        <div class="notice">这里只维护 save_mode_create_template，用于新建 Doris 表时生成 DDL。同步前 SQL 已移到“写入模式”，跟随 data_save_mode = CUSTOM_PROCESSING 展示。</div>
        <div class="grid2">
          <div class="field full"><label>建表模板（save_mode_create_template）</label><textarea class="sql-template" data-doris="saveModeCreateTemplate">${escapeHtml(d.saveModeCreateTemplate)}</textarea><div class="field-note">支持 ${'${database}'}、${'${table_name}'}、${'${rowtype_fields}'}、${'${rowtype_primary_key}'}、${'${rowtype_unique_key}'}、${'${comment}'} 占位符。</div></div>
        </div>
      `,
      config: `
        <div class="sink-section-title"><span>doris.config 参数</span><span class="badge">按格式联动</span></div>
        <div class="grid3">
          <div class="field"><label class="label-help">Stream Load 格式<span class="help-icon" tabindex="0">!</span><span class="help-popover" data-testid="format-help">决定传给 Doris Stream Load 的数据格式。JSON 适合结构化字段，CSV 适合分隔符文本。</span></label><select data-doris="format">${selectOptions(['json','csv'], d.format)}</select></div>
          <div class="field ${jsonMode ? '' : 'hidden'}" data-testid="json-read-line-field"><label class="label-help">read_json_by_line<span class="help-icon" tabindex="0">!</span><span class="help-popover" data-testid="read-json-help">JSON 每行一条记录时设为 true。常规同步建议保持 true。</span></label><select data-doris="readJsonByLine">${boolOptions(d.readJsonByLine)}</select></div>
          <div class="field ${jsonMode ? '' : 'hidden'}" data-testid="json-strip-field"><label class="label-help">strip_outer_array<span class="help-icon" tabindex="0">!</span><span class="help-popover" data-testid="strip-array-help">JSON 外层是数组时设为 true，让 Doris 拆开数组逐行写入。</span></label><select data-doris="stripOuterArray">${boolOptions(d.stripOuterArray)}</select></div>
          <div class="field ${jsonMode ? 'hidden' : ''}" data-testid="csv-separator-field"><label class="label-help">column_separator<span class="help-icon" tabindex="0">!</span><span class="help-popover" data-testid="column-separator-help">CSV 字段分隔符，必须和 SeaTunnel 输出字段顺序一致。</span></label><input data-doris="columnSeparator" value="${escapeHtml(d.columnSeparator)}" /></div>
          <div class="field"><label class="label-help">load_to_single_tablet<span class="help-icon" tabindex="0">!</span><span class="help-popover" data-testid="single-tablet-help">是否写入单个 tablet。默认 false 更适合分布式写入，true 只适合小表或特殊调试。</span></label><select data-doris="loadToSingleTablet">${boolOptions(d.loadToSingleTablet)}</select></div>
        </div>
      `
    };

    mount.innerHTML = `
      <div class="cardbox" data-testid="doris-sink-workbench">
        ${renderTargetSelector()}
        <div class="sink-tabs" role="tablist" aria-label="Doris Sink 配置分组">
          ${tabs.map(tab => `<button class="sink-tab ${state.dorisTab === tab.id ? 'active' : ''}" data-sink-tab="${tab.id}" type="button">${tab.label}</button>`).join('')}
        </div>
        <div class="sink-tab-panel" data-testid="sink-tab-panel">
          ${tabBodies[state.dorisTab]}
        </div>

        <div class="sql-panel">
          <div class="sql-head">
            <span>Doris Sink 配置预览</span>
            <button class="btn" id="copyDorisConfig" style="height:24px;">复制配置</button>
          </div>
          <pre id="dorisConfigText">${escapeHtml(buildDorisConfigText())}</pre>
        </div>
      </div>
    `;

    mount.querySelectorAll('[data-sink-target]').forEach(btn => {
      btn.onclick = () => {
        state.sinkTarget = btn.dataset.sinkTarget;
        render();
      };
    });
    mount.querySelectorAll('[data-doris]').forEach(el => {
      const updateState = () => {
        state.dorisSink[el.dataset.doris] = el.value;
      };
      if (el.tagName === 'SELECT') {
        el.onchange = () => {
          updateState();
          render();
        };
        return;
      }
      el.oninput = () => {
        updateState();
        const config = document.getElementById('dorisConfigText');
        if (config) config.textContent = buildDorisConfigText();
      };
      el.onchange = () => {
        updateState();
        render();
      };
    });
    mount.querySelectorAll('[data-sink-tab]').forEach(btn => {
      btn.onclick = () => {
        state.dorisTab = btn.dataset.sinkTab;
        render();
      };
    });
    const copy = document.getElementById('copyDorisConfig');
    if (copy) {
      copy.onclick = async () => {
        try {
          await navigator.clipboard.writeText(buildDorisConfigText());
          pulse('Doris 配置已复制');
        } catch {
          pulse('复制失败，请手动复制');
        }
      };
    }
  }

  function renderPanel(){
    const m = modules.find(item => item.id === state.current);
    document.getElementById('moduleTitle').textContent = m.name;
    document.getElementById('moduleDesc').textContent = m.desc;
    document.getElementById('moduleChip').textContent = m.chip;
    document.getElementById('moduleChip').className = `chip ${m.id === 'mapping' ? 'good' : m.id === 'filter' ? 'warn' : ''}`;
    document.getElementById('moduleBody').innerHTML = m.body;
    if (m.id === 'filter') renderFilter();
    if (m.id === 'sink') renderDorisSink();
  }

  function pulse(msg){
    const chip = document.getElementById('moduleChip');
    const old = chip.textContent;
    chip.textContent = msg;
    chip.className = 'chip warn';
    clearTimeout(pulse._t);
    pulse._t = setTimeout(() => {
      render();
    }, 1000);
  }

  function render(){
    renderMenu();
    renderPanel();
    document.getElementById('summaryText').textContent = '4 个模块';
    ensureMappingWorkbenchLoaded();
  }

  async function loadMappingWorkbench() {
    const mount = document.getElementById('mappingV4Mount');
    if (!mount) return;
    try {
      mount.innerHTML = '<div class="hint">字段映射工作台加载中...</div>';
      const response = await fetch('field-mapping-workbench-v4.html');
      const html = await response.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const style = doc.querySelector('style');
      const card = doc.querySelector('.mapping-card');
      const toast = doc.querySelector('#toast');
      const script = doc.querySelector('script');

      if (style && !document.getElementById('mappingV4Style')) {
        const styleNode = document.createElement('style');
        styleNode.id = 'mappingV4Style';
        styleNode.textContent = style.textContent;
        document.head.appendChild(styleNode);
      }

      if (!card || !script) {
        throw new Error('V4 mapping-card or script not found');
      }

      mount.innerHTML = `
        <div id="summaryMetrics" style="display:none"></div>
        <div id="summaryDesc" style="display:none"></div>
        ${card.outerHTML}
        ${toast ? toast.outerHTML : '<div class="toast" id="toast"></div>'}
      `;
      const scriptNode = document.createElement('script');
      scriptNode.textContent = `(function(){\n${script.textContent}\n})();`;
      document.body.appendChild(scriptNode);
    } catch (error) {
      mount.innerHTML = `<div class="mapping-v4-error">字段映射工作台加载失败：${error.message}</div>`;
    }
  }

  function ensureMappingWorkbenchLoaded() {
    if (state.current === 'mapping') {
      loadMappingWorkbench();
    }
  }

  render();
</script>
</body>
</html>
