<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>主题库 - 公安业务主题工作台</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      color: #1f2937;
      background: #eef1f4;
      font-size: 13px;
    }
    button, input, select, textarea { font: inherit; }
    .page {
      display: grid;
      grid-template-rows: 52px minmax(0, 1fr);
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      border-bottom: 1px solid #d8dde6;
      background: #fbfcfe;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 220px;
      font-weight: 700;
      font-size: 15px;
    }
    .brandIcon {
      display: grid;
      place-items: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: #1f5fbf;
      color: #fff;
      font-weight: 800;
    }
    .brandSub {
      padding-left: 8px;
      border-left: 1px solid #d8dde6;
      color: #667085;
      font-size: 12px;
      font-weight: 500;
    }
    .search, .select, .fieldInput, textarea {
      border: 1px solid #d8dde6;
      border-radius: 6px;
      background: #fff;
      color: #344054;
    }
    .search {
      width: min(420px, 30vw);
      height: 32px;
      padding: 0 10px;
    }
    .select {
      height: 32px;
      min-width: 120px;
      padding: 0 28px 0 10px;
    }
    .btn, .linkBtn, .tab, .menuItem {
      border: 0;
      background: none;
      color: #344054;
      cursor: pointer;
    }
    .btn {
      height: 32px;
      padding: 0 12px;
      border: 1px solid #d8dde6;
      border-radius: 6px;
      background: #fff;
    }
    .btnPrimary {
      border-color: #1f5fbf;
      background: #1f5fbf;
      color: #fff;
    }
    .linkBtn {
      color: #1f5fbf;
      font-size: 12px;
      font-weight: 700;
    }
    .createWrap { position: relative; margin-left: auto; }
    .createMenu {
      position: absolute;
      top: 38px;
      right: 0;
      z-index: 20;
      width: 154px;
      padding: 6px;
      border: 1px solid #d8dde6;
      border-radius: 7px;
      background: #fff;
      box-shadow: 0 12px 30px rgba(15, 23, 42, .14);
    }
    .menuItem {
      display: block;
      width: 100%;
      height: 32px;
      padding: 0 9px;
      border-radius: 5px;
      text-align: left;
    }
    .menuItem:hover { background: #f0f5ff; color: #1f5fbf; }
    .workspace {
      display: grid;
      grid-template-columns: var(--domain-width, 292px) 8px minmax(0, 1fr);
      min-height: 0;
      overflow: hidden;
    }
    .workspace.domainCollapsed .domainPane { overflow: hidden; border-right: 0; }
    .workspace.domainCollapsed .domainPane > * { display: none; }
    .domainPane, .contentPane {
      display: grid;
      min-height: 0;
      border-right: 1px solid #d8dde6;
      background: #fff;
    }
    .domainPane { grid-template-rows: 44px minmax(0, 1fr) 44px; background: #f8fafc; }
    .contentPane { grid-template-rows: 58px minmax(0, 1fr); border-right: 0; background: #fbfcfe; }
    .splitter {
      width: 8px;
      cursor: col-resize;
      background: #eef2f7;
      border-right: 1px solid #d8dde6;
    }
    .splitter:hover, .splitter.dragging { background: #dbeafe; }
    .paneHeader, .contentHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      min-width: 0;
      padding: 0 12px;
      border-bottom: 1px solid #d8dde6;
      color: #475467;
      font-weight: 700;
    }
    .contentTitle strong { display: block; font-size: 18px; color: #101828; }
    .contentTitle span { color: #667085; font-size: 12px; font-weight: 500; }
    .domainList, .contentBody { overflow: auto; }
    .domainList { padding: 8px 6px; }
    .domainCard {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 5px 8px;
      width: 100%;
      margin-bottom: 6px;
      padding: 10px 10px 10px 12px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      text-align: left;
    }
    .domainCard.active {
      border-color: #bdd2f6;
      background: #eef5ff;
    }
    .domainCard.active::before {
      content: "";
      position: absolute;
      left: 0;
      top: 9px;
      bottom: 9px;
      width: 3px;
      border-radius: 3px;
      background: #1f5fbf;
    }
    .domainName { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #1f2937; font-weight: 700; }
    .domainMeta, .cardMeta, .muted { color: #667085; font-size: 12px; }
    .pill {
      display: inline-flex;
      align-items: center;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      background: #eef2f7;
      color: #475467;
      font-size: 12px;
      white-space: nowrap;
    }
    .pillBlue { background: #e8f1ff; color: #1f5fbf; }
    .pillGreen { background: #e8f6f0; color: #087443; }
    .pillAmber { background: #fff3d7; color: #9a6700; }
    .paneFooter {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 0 12px;
      border-top: 1px solid #d8dde6;
    }
    .objectToolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-bottom: 12px;
      max-width: 760px;
    }
    .objectToolbar input { flex: 1; min-width: 280px; height: 32px; padding: 0 9px; }
    .objectGrid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 10px;
      margin-bottom: 14px;
    }
    .objectCard {
      display: block;
      width: 100%;
      min-height: 154px;
      padding: 12px;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      background: #fff;
      text-align: left;
    }
    .objectCard.active {
      border-color: #8db4ee;
      background: #f2f7ff;
      box-shadow: inset 0 0 0 1px #8db4ee;
    }
    .objectTitle { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
    .objectTitle strong { font-size: 15px; color: #101828; }
    .titleActions { display: inline-flex; align-items: center; gap: 6px; }
    .miniEdit {
      height: 22px;
      padding: 0 7px;
      border: 1px solid #d8dde6;
      border-radius: 999px;
      background: #fff;
      color: #475467;
      font-size: 12px;
    }
    .miniEdit:hover { border-color: #8db4ee; color: #1f5fbf; background: #f6f9ff; }
    .objectDesc { color: #344054; line-height: 1.5; }
    .expandedObjectRow {
      grid-column: 1 / -1;
      display: grid;
      gap: 10px;
    }
    .collapsedHint {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 54px;
      padding: 10px 12px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      color: #475467;
    }
    .collapsedHint strong {
      display: block;
      margin-bottom: 2px;
      color: #101828;
      font-size: 14px;
    }
    .assetFocus {
      grid-column: 1 / -1;
      border: 1px solid #c8d7ee;
      border-radius: 8px;
      background: #fff;
      overflow: hidden;
    }
    .assetFocusHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid #e4eaf2;
      background: #f8fbff;
    }
    .assetFocusTitle {
      min-width: 0;
    }
    .assetFocusTitle h3 {
      margin: 0 0 3px;
      color: #101828;
      font-size: 15px;
    }
    .assetFocusTitle p {
      margin: 0;
      color: #667085;
      font-size: 12px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .assetFocusMeta {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .assetTableIntro {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      border-bottom: 1px solid #e8edf3;
      color: #475467;
      font-size: 12px;
    }
    .assetWorkspace {
      display: grid;
      gap: 10px;
      padding: 0 12px 12px;
      background: #fbfdff;
    }
    .scenarioList {
      display: flex;
      gap: 0;
      overflow-x: auto;
      border-bottom: 1px solid #d8dde6;
    }
    .scenarioCard {
      display: inline-flex;
      align-items: center;
      min-width: max-content;
      height: 36px;
      padding: 0 14px;
      border: 0;
      border-right: 1px solid #e4eaf2;
      border-bottom: 2px solid transparent;
      border-radius: 0;
      background: #f8fafc;
      text-align: left;
    }
    .scenarioCard:hover, .scenarioCard.active {
      border-bottom-color: #1f5fbf;
      background: #fff;
      box-shadow: none;
    }
    .scenarioCard strong { color: #101828; font-size: 13px; }
    .scenarioCard span { display: none; }
    .scenarioMain {
      display: grid;
      gap: 10px;
      min-width: 0;
    }
    .scenarioHeader { display: none; }
    .scenarioHeader h4 { margin: 0 0 5px; color: #101828; font-size: 15px; }
    .scenarioHeader p { margin: 0; color: #475467; font-size: 12px; line-height: 1.55; }
    .assetCards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 10px;
    }
    .scenarioSummaryGrid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 2px;
    }
    .summaryTile {
      padding: 8px 10px;
      border: 1px solid #e4eaf2;
      border-radius: 8px;
      background: #fff;
    }
    .summaryTile strong {
      display: block;
      margin-bottom: 3px;
      color: #101828;
      font-size: 17px;
    }
    .summaryTile span { color: #667085; font-size: 12px; }
    .scenarioItemsHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 0;
      color: #344054;
      font-weight: 700;
    }
    .scenarioQueryLine {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .scenarioQueryLine .muted { font-weight: 700; }
    .scenarioBlockGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .scenarioBlock {
      display: grid;
      gap: 10px;
      min-width: 0;
      min-height: 180px;
      resize: both;
      padding: 12px;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      background: #fff;
      overflow: auto;
    }
    .scenarioBlock.full { grid-column: 1 / -1; }
    .scenarioBlockHead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }
    .scenarioBlockHead h4 {
      margin: 0 0 5px;
      color: #101828;
      font-size: 15px;
    }
    .scenarioBlockHead .meta {
      color: #667085;
      font-size: 12px;
      line-height: 1.45;
      font-weight: 700;
    }
    .scenarioBlockHead .code {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 10px;
      border-radius: 7px;
      background: #eef2f7;
      color: #475467;
      font-weight: 800;
      white-space: nowrap;
    }
    .scenarioBlockHead .editInsight {
      border: 0;
      background: none;
      color: #1f5fbf;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .blockActionGroup {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .blockActionGroup button {
      border: 0;
      background: none;
      color: #1f5fbf;
      font-weight: 800;
      white-space: nowrap;
      cursor: pointer;
    }
    .blockActionGroup button[data-delete-insight] { color: #b42318; }
    .scenarioBlock .remark {
      margin: 0;
      color: #667085;
      font-size: 12px;
      line-height: 1.6;
      font-weight: 700;
    }
    .miniRankList {
      display: grid;
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .miniRankList li {
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) 76px;
      gap: 10px;
      align-items: center;
      min-height: 38px;
      padding: 0 10px;
      border-radius: 8px;
      background: #f8fafc;
      color: #1f2937;
      font-weight: 800;
    }
    .miniPiePanel {
      display: grid;
      grid-template-columns: 136px minmax(0, 1fr);
      gap: 16px;
      align-items: center;
      min-height: 162px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
    }
    .miniBarChart {
      display: grid;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      background: #f8fafc;
    }
    .miniBarRow {
      display: grid;
      grid-template-columns: 112px minmax(0, 1fr) 64px;
      gap: 10px;
      align-items: center;
      color: #475467;
      font-weight: 800;
    }
    .miniBarTrack {
      height: 12px;
      border-radius: 999px;
      background: #e8edf3;
      overflow: hidden;
    }
    .miniBarFill {
      display: block;
      height: 100%;
      border-radius: 999px;
      background: #1f5fbf;
    }
    .layoutControls {
      display: inline-flex;
      gap: 6px;
      align-items: center;
      margin-left: 6px;
    }
    .miniPieChart {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      background: conic-gradient(#1f5fbf 0 42%, #60a5fa 42% 68%, #f59e0b 68% 84%, #22c55e 84% 100%);
      box-shadow: inset 0 0 0 22px #fff;
    }
    .miniLegend {
      display: grid;
      gap: 10px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .miniLegend li {
      display: grid;
      grid-template-columns: 10px minmax(0, 1fr) 48px;
      gap: 8px;
      align-items: center;
      color: #475467;
      font-weight: 800;
    }
    .miniLegend i {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }
    .sqlActions {
      display: flex;
      gap: 6px;
    }
    .sqlEditor {
      min-height: 220px;
      border-color: #cfd8e6;
      background: #fbfdff;
      color: #1d2939;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.55;
    }
    .queryStatus {
      min-height: 18px;
      color: #667085;
      font-size: 12px;
    }
    .queryStatus.success { color: #067647; }
    .queryStatus.warn { color: #b54708; }
    .assetCard {
      display: grid;
      gap: 8px;
      padding: 11px;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      background: #fff;
      text-align: left;
    }
    .assetCard:hover, .assetCard.active {
      border-color: #8db4ee;
      background: #f6f9ff;
      box-shadow: inset 0 0 0 1px #8db4ee;
    }
    .assetCardHead {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 8px;
    }
    .assetCardHead strong { color: #101828; font-size: 14px; }
    .assetPurpose {
      min-height: 38px;
      color: #344054;
      font-size: 12px;
      line-height: 1.55;
    }
    .assetEntryList {
      display: grid;
      gap: 5px;
      padding: 0;
      margin: 0;
      list-style: none;
    }
    .assetEntryList li {
      display: grid;
      grid-template-columns: 62px minmax(0, 1fr);
      gap: 6px;
      color: #475467;
      font-size: 12px;
      line-height: 1.45;
    }
    .assetEntryList b {
      color: #667085;
      font-weight: 700;
    }
    .assetMetaGrid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }
    .assetMeta {
      padding: 6px;
      border-radius: 6px;
      background: #f5f7fa;
      color: #475467;
      font-size: 12px;
    }
    .assetMeta strong {
      display: block;
      color: #101828;
      font-size: 12px;
    }
    .assetActions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .assetAction {
      height: 26px;
      padding: 0 8px;
      border: 1px solid #d8dde6;
      border-radius: 6px;
      background: #fff;
      color: #344054;
      font-size: 12px;
    }
    .assetDetail {
      display: grid;
      gap: 10px;
      margin-top: 10px;
      padding: 10px;
      border: 1px solid #c8d7ee;
      border-radius: 8px;
      background: #fff;
    }
    .assetDetailHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .assetDetailHeader h4 { margin: 0; color: #101828; font-size: 15px; }
    .assetDetailTabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .assetDetailTab {
      height: 28px;
      padding: 0 10px;
      border: 1px solid #d8dde6;
      border-radius: 6px;
      background: #fff;
      color: #475467;
      font-weight: 700;
    }
    .assetDetailTab.active {
      border-color: #8db4ee;
      background: #e8f1ff;
      color: #1f5fbf;
    }
    .detailGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .miniPanel {
      padding: 10px;
      border: 1px solid #e4eaf2;
      border-radius: 8px;
      background: #fff;
    }
    .miniPanel h4 {
      margin: 0 0 6px;
      color: #667085;
      font-size: 12px;
    }
    .miniPanel p { margin: 0; color: #344054; font-size: 12px; line-height: 1.55; }
    .compactInfoGrid {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-top: 10px;
    }
    .compactInfo {
      min-height: 70px;
      padding: 9px 10px;
      border: 1px solid #e4eaf2;
      border-radius: 8px;
      background: #fff;
    }
    .compactInfo h3 {
      margin: 0 0 5px;
      color: #667085;
      font-size: 12px;
    }
    .compactInfo p {
      margin: 0;
      color: #344054;
      font-size: 12px;
      line-height: 1.5;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-top: 10px;
    }
    .stat {
      padding: 6px;
      border-radius: 6px;
      background: #f5f7fa;
      text-align: center;
    }
    .stat strong { display: block; color: #101828; }
    .tabs {
      display: flex;
      align-items: stretch;
      gap: 2px;
      padding: 0 10px;
      border-bottom: 1px solid #d8dde6;
      background: #fff;
      overflow-x: auto;
    }
    .tab {
      min-width: max-content;
      padding: 0 11px;
      border-bottom: 2px solid transparent;
      color: #667085;
      font-weight: 700;
    }
    .tab.active {
      border-bottom-color: #1f5fbf;
      color: #1f5fbf;
    }
    .contentBody { padding: 14px 16px 18px; }
    .summaryGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 12px;
    }
    .panel {
      padding: 12px;
      border: 1px solid #d8dde6;
      border-radius: 8px;
      background: #fff;
    }
    .panel h3 {
      margin: 0 0 9px;
      color: #101828;
      font-size: 14px;
    }
    .panel p, .panel li { line-height: 1.65; }
    .panel p { margin: 0; }
    ul { margin: 0; padding-left: 18px; }
    table {
      width: 100%;
      min-width: 980px;
      border-collapse: collapse;
      table-layout: fixed;
      background: #fff;
    }
    th, td {
      height: 38px;
      padding: 0 10px;
      border-bottom: 1px solid #e8edf3;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    th { background: #f8fafc; color: #667085; font-size: 12px; font-weight: 700; }
    .tableWrap { border: 1px solid #d8dde6; border-radius: 8px; overflow: auto; background: #fff; }
    .metricCards {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }
    .notice {
      margin-bottom: 12px;
      padding: 10px 12px;
      border: 1px solid #bdd2f6;
      border-radius: 8px;
      background: #eef5ff;
      color: #1f5fbf;
    }
    .formGrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    const state = { domainId: 'alarm', objectId: '', tab: 'overview', notice: '', editing: null, role: 'admin', hiddenInsights: new Set(), deletedInsights: new Set() };
    const sqlState = { object: null, scenario: null, main: null };
    const insightEditState = { object: null, scenario: null, main: null, key: null, type: null };
    const objectEditState = { domain: null, object: null };

    function canEdit() {
      return state.role === 'admin' || state.role === 'editor';
    }

    function realDomains() {
      return themeDomains.filter(domain => !domain.virtual);
    }

    function objectsForDomain(domain) {
      if (!domain || domain.id === 'all') {
        return realDomains().flatMap(item => item.objects.map(object => ({ ...object, domainName: item.name, domainId: item.id })));
      }
      return domain.objects.map(object => ({ ...object, domainName: domain.name, domainId: domain.id }));
    }

    function getActiveDomain() {
      return themeDomains.find(domain => domain.id === state.domainId) || themeDomains[1];
    }

    function getActiveObject() {
      const domain = getActiveDomain();
      const objects = objectsForDomain(domain);
      return objects.find(object => object.id === state.objectId) || null;
    }

    function assetCount(domain) {
      const objects = domain.id === 'all' ? realDomains().flatMap(item => item.objects) : domain.objects;
      return objects.reduce((sum, object) => sum + object.assets.length, 0);
    }

      const list = document.getElementById('domainList');
      list.innerHTML = themeDomains.map(domain => {
        const objectCount = domain.id === 'all' ? realDomains().reduce((sum, item) => sum + item.objects.length, 0) : domain.objects.length;
        return `
          <div class="domainCard ${domain.id === state.domainId ? 'active' : ''}" role="button" tabindex="0" data-domain-id="${domain.id}">
            <span class="domainName">${domain.name}</span>
            <span class="titleActions">
              ${canEdit() ? `<button class="miniEdit" type="button" data-edit-domain="${domain.id}">编辑</button>` : ''}
              <span class="pill ${domain.status === '建设中' ? 'pillAmber' : 'pillGreen'}">${domain.status}</span>
            </span>
            <span class="domainMeta">${objectCount} 个业务对象 / ${assetCount(domain)} 项资产</span>
            <span class="domainMeta">${domain.owner}</span>
          </div>
        `;
      }).join('');
      list.querySelectorAll('[data-edit-domain]').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          openEditForm('domain', button.dataset.editDomain);
        });
      });
      list.querySelectorAll('[data-domain-id]').forEach(button => {
        button.addEventListener('click', () => {
          state.domainId = button.dataset.domainId;
          state.objectId = '';
          state.tab = 'overview';
          state.notice = '';
          renderAll();
        });
        button.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') button.click();
        });
      });
    }

    function renderContent() {
      const domain = getActiveDomain();
      const body = document.getElementById('contentBody');
      document.getElementById('contentTitle').textContent = domain.name;
      document.getElementById('contentSubtitle').textContent = '业务对象与主题资产';
      const search = document.getElementById('globalSearch').value.trim();
      const keyword = search;
      const objects = objectsForDomain(domain).filter(object => !keyword || object.name.includes(keyword) || object.definition.includes(keyword));
      const object = objects.find(item => item.id === state.objectId) || null;
      const hasObjects = objectsForDomain(domain).length > 0;
      if (!hasObjects) {
        body.innerHTML = `
          ${state.notice ? `<div class="notice">${state.notice}</div>` : ''}
          <div class="objectToolbar"><input class="fieldInput" disabled placeholder="该主题暂无可搜索业务项" />${canEdit() ? '<button class="btn btnPrimary" type="button" data-create-type="object">新增业务项</button>' : ''}</div>
          <div class="emptyState">
            <h3>该主题还没有业务对象</h3>
            <p class="muted">${canEdit() ? '可以继续点击“新增业务项”，为这个主题补充业务内容和分析场景。' : '当前账号只有查看权限，请联系管理员维护主题内容。'}</p>
          </div>
        `;
        body.querySelector('[data-create-type]')?.addEventListener('click', event => openCreateForm(event.target.dataset.createType));
        return;
      }
      const notice = state.notice ? `<div class="notice">${state.notice}</div>` : '';
      body.innerHTML = `
        ${notice}
        <div class="objectToolbar">
          <input class="fieldInput" id="objectSearch" placeholder="搜索当前主题域业务项" value="${keyword}" />
          ${canEdit() ? '<button class="btn btnPrimary" type="button" data-create-type="object">新增业务项</button>' : ''}
          ${canEdit() ? '<button class="btn" type="button" data-create-type="asset">新增分析场景</button>' : ''}
        </div>
        <div class="objectGrid" id="objectGrid">
          ${objects.map(item => `
            <div class="objectCard ${item.id === state.objectId ? 'active' : ''}" role="button" tabindex="0" data-object-id="${item.id}">
              <span class="objectTitle"><strong>${item.name}</strong><span class="titleActions">${canEdit() ? `<button class="miniEdit" type="button" data-edit-object="${item.domainId}::${item.id}">编辑</button>` : ''}<span class="pill">${item.status}</span></span></span>
              <span class="objectDesc">${item.definition}</span>
              <span class="cardMeta">覆盖范围：${item.scope}</span>
              <span class="stats dynamicStats">
                ${objectStatItems(item).map(stat => `<span class="stat"><strong>${stat.value}</strong><span class="muted">${stat.label}</span></span>`).join('')}
              </span>
            </div>
          `).join('') || '<div class="panel">没有匹配的业务对象</div>'}
        </div>
      `;
      body.querySelectorAll('[data-create-type]').forEach(button => {
        button.addEventListener('click', () => openCreateForm(button.dataset.createType));
      });
      body.querySelectorAll('[data-edit-object]').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          openObjectStatsModal(button.dataset.editObject);
        });
      });
      body.querySelectorAll('[data-object-id]').forEach(button => {
        button.addEventListener('click', () => {
          state.objectId = state.objectId === button.dataset.objectId ? '' : button.dataset.objectId;
          state.notice = '';
          renderAll();
        });
        button.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') button.click();
        });
      });
      const objectSearch = document.getElementById('objectSearch');
      if (objectSearch) {
        objectSearch.addEventListener('input', event => {
          document.getElementById('globalSearch').value = event.target.value;
          renderContent();
        });
      }
      if (object) placeExpandedDetailAfterObjectRow(object);
    }

    function placeExpandedDetailAfterObjectRow(object) {
      const grid = document.getElementById('objectGrid');
      const selectedCard = grid.querySelector(`[data-object-id="${object.id}"]`);
      if (!selectedCard) return;
      const cards = Array.from(grid.querySelectorAll('.objectCard'));
      const selectedTop = selectedCard.offsetTop;
      let rowEndCard = selectedCard;
      for (const card of cards) {
        if (card.offsetTop === selectedTop) {
          rowEndCard = card;
        } else if (card.offsetTop > selectedTop) {
          break;
        }
      }
      const detail = document.createElement('div');
      detail.className = 'expandedObjectRow';
      detail.innerHTML = renderObjectAssetFocus(object);
      rowEndCard.after(detail);
      bindAssetWorkspace(detail, object);
    }

    function renderObjectAssetFocus(object) {
      return `
        <section class="assetFocus">
          ${renderAssets(object)}
        </section>
      `;
    }

    function renderOverview(object) {
      const sharedAssets = object.assets.filter(asset => asset.relatedObjects && asset.relatedObjects.length > 1);
      return `
        <div class="summaryGrid">
          <div class="panel"><h3>业务定义</h3><p>${object.definition}</p></div>
          <div class="panel"><h3>覆盖范围</h3><p>${object.scope}</p></div>
          <div class="panel"><h3>典型业务问题</h3><ul>${object.questions.map(item => `<li>${item}</li>`).join('')}</ul></div>
          <div class="panel"><h3>来源系统</h3><p>${object.systems.join('、')}</p><p class="muted">负责人：${object.owner}</p></div>
        </div>
        <div class="summaryGrid">
          <div class="panel"><h3>相关资产摘要</h3><p>${object.assets.map(item => item.name).join('、')}</p></div>
          <div class="panel"><h3>业务指标摘要</h3><p>${object.metrics.map(item => item.name).join('、')}</p></div>
          <div class="panel"><h3>字段标准摘要</h3><p>${object.fields.map(item => item.zh).join('、')}</p></div>
          <div class="panel"><h3>数据关系</h3><p>业务对象连接来源系统、主题资产、字段标准和指标口径，帮助用户先理解业务，再进入资产明细。</p></div>
        </div>
        ${sharedAssets.length ? `<div class="panel"><h3>共享资产说明</h3><p>${sharedAssets.map(asset => `“${asset.name}”只登记一份，但同时关联${asset.relatedObjects.join('、')}。当前对象使用范围：${asset.usageByObject[object.name] || '按业务口径使用相关字段。'}`).join('；')}</p></div>` : ''}
      `;
    }

    function renderAssets(object) {
      return `
        <div class="assetWorkspace">
          <div class="scenarioList">
            ${assetScenarios(object).map((scenario, index) => `
              <div class="scenarioCard ${index === 0 ? 'active' : ''}" role="button" tabindex="0" data-scenario-index="${index}">
                <strong>${scenario.title}</strong>
                ${canEdit() ? `<button class="miniEdit" type="button" data-edit-scenario="${object.domainId || state.domainId}::${object.id}::${index}">编辑</button>` : ''}
                <span>${scenario.goal}</span>
              </div>
            `).join('')}
          </div>
          <div class="scenarioMain" id="scenarioMain">${renderScenarioWorkspace(object, assetScenarios(object)[0], 0)}</div>
        </div>
      `;
    }

    function bindAssetWorkspace(root, object) {
      const main = root.querySelector('#scenarioMain');
      root.querySelectorAll('[data-scenario-index]').forEach(button => {
        button.addEventListener('click', () => {
          const scenarioIndex = Number(button.dataset.scenarioIndex);
          root.querySelectorAll('[data-scenario-index]').forEach(item => item.classList.toggle('active', item === button));
          main.innerHTML = renderScenarioWorkspace(object, assetScenarios(object)[scenarioIndex], 0);
          bindScenarioWorkspace(main, object, assetScenarios(object)[scenarioIndex]);
        });
        button.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') button.click();
        });
      });
      root.querySelectorAll('[data-edit-scenario]').forEach(button => {
        button.addEventListener('click', event => {
          event.stopPropagation();
          openEditForm('asset', button.dataset.editScenario);
        });
      });
      bindScenarioWorkspace(main, object, assetScenarios(object)[0]);
    }

    function assetScenarios(object) {
      if (object.scenarios && object.scenarios.length) return object.scenarios;
      return object.questions.map((question, index) => ({
        title: question,
        goal: `围绕“${question}”查看需要哪些资产、字段和指标支撑。`,
        assets: object.assets.map(asset => asset.name),
        metrics: object.metrics.map(metric => metric.name),
        fields: object.fields.map(field => field.zh),
        summary: buildScenarioSummary(object, index),
        items: buildScenarioItems(object, question, index)
      }));
    }

    function objectBusinessSnapshot(object) {
      if (object.statConfig) {
        return {
          volume: object.statConfig.volumeValue || '0 条',
          volumeLabel: object.statConfig.volumeLabel || (object.id === 'alarm-receive' ? '今日接报' : '今日业务量'),
          attention: object.statConfig.attentionValue || '0 条'
        };
      }
      const firstScenario = assetScenarios(object)[0];
      const summary = firstScenario?.summary || [];
      const total = summary[0]?.value || `${126 + object.name.length * 9} 条`;
      const attention = summary[3]?.value || `${8 + object.name.length} 条`;
      return {
        volume: total,
        volumeLabel: object.id === 'alarm-receive' ? '今日接报' : '今日业务量',
        attention
      };
    }

    function objectStatItems(object) {
      if (object.statItems && object.statItems.length) return object.statItems;
      const snapshot = objectBusinessSnapshot(object);
      return [
        { label: '资产', value: `${object.assets?.length || assetScenarios(object).length}`, sql: defaultObjectStatsSql(object, 'asset') },
        { label: snapshot.volumeLabel, value: snapshot.volume, sql: defaultObjectStatsSql(object, 'volume') },
        { label: '待关注', value: snapshot.attention, sql: defaultObjectStatsSql(object, 'attention') }
      ];
    }

    function defaultObjectStatsSql(object, type) {
      const tableName = object.assets?.[0]?.code || object.id.replaceAll('-', '_');
      if (type === 'asset') return `select count(*) as asset_count\nfrom theme_asset\nwhere object_code = '${object.id}';`;
      if (type === 'attention') return `select count(*) as attention_count\nfrom ${tableName}\nwhere stat_date = current_date\n  and status in ('需关注', '待治理', '待反馈');`;
      return `select count(*) as total_count\nfrom ${tableName}\nwhere stat_date = current_date;`;
    }

    function runObjectStatPreview(object, type, sql) {
      const lower = (sql || '').toLowerCase();
      if (type === 'asset') return `${object.assets?.length || 0}`;
      if (type === 'attention') {
        if (lower.includes('repeat')) return '9 条';
        if (lower.includes('quality')) return '28 条';
        return object.id === 'alarm-receive' ? '17 起' : `${8 + object.name.length} 条`;
      }
      if (object.id === 'alarm-receive') return '1,286 起';
      return `${126 + object.name.length * 9} 条`;
    }

    function buildScenarioSummary(object, index) {
      const base = 126 + index * 37 + object.name.length * 9;
      return [
        { label: '当前总量', value: `${base} 条` },
        { label: '较昨日', value: `${index % 2 === 0 ? '+' : '-'}${6 + index * 2}.3%` },
        { label: '涉及单位', value: `${4 + index} 个` },
        { label: '待处置', value: `${8 + index * 3} 条` }
      ];
    }

    function buildScenarioItems(object, question, index) {
      const fields = object.fields.map(field => field.zh).join('、') || '业务编号、所属单位、更新时间';
      const unitA = object.owner || '业务责任组';
      const unitB = object.systems?.[0] || '来源系统';
      return [
        {
          title: `${object.name}${question.replace(/[？?。]/g, '')}汇总`,
          primary: `当前已汇总 ${126 + index * 37} 条，较近 7 日均值变化明显`,
          unit: unitA,
          status: index % 2 === 0 ? '需关注' : '运行中',
          fields,
          result: `用于判断${object.name}是否存在异常波动，并辅助业务单位安排处置。`
        },
        {
          title: `${object.name}重点单位排行`,
          primary: `排名前 3 单位贡献约 ${42 + index * 5}% 的业务量`,
          unit: unitB,
          status: '运行中',
          fields,
          result: '用于定位重点单位、重点环节和后续治理对象。'
        },
        {
          title: `${object.name}待治理清单`,
          primary: `发现 ${8 + index * 3} 条待补充、待核查或待闭环记录`,
          unit: '数据治理组',
          status: '待治理',
          fields,
          result: '用于形成治理任务，推动责任单位补齐信息并闭环。'
        }
      ];
    }

    function renderScenarioWorkspace(object, scenario, activeAssetIndex) {
      return `
        <div class="scenarioSummaryGrid">
          ${(scenario.summary || []).map(item => `<div class="summaryTile"><strong>${item.value}</strong><span>${item.label}</span></div>`).join('')}
        </div>
        ${renderScenarioInsightBlocks(object, scenario)}
        <div class="scenarioItemsHeader">
          <span>具体条目信息</span>
          <span class="scenarioQueryLine">
            ${canEdit() ? '<button class="linkBtn" type="button" data-open-sql>编辑SQL</button>' : ''}
            <span class="muted" data-query-status>${queryStatusText(scenario)}</span>
          </span>
        </div>
        <div class="tableWrap">
          <table>
            <thead><tr><th>条目名称</th><th>汇总信息</th><th>责任单位</th><th>状态</th><th>使用字段</th><th>业务处置建议</th></tr></thead>
            <tbody data-result-body>${renderScenarioRows(scenario.items || [])}</tbody>
          </table>
        </div>
      `;
    }

    function renderScenarioInsightBlocks(object, scenario) {
      const isAlarmReceiveTrend = object.id === 'alarm-receive' && (scenario.title || '').includes('接警总量');
      const rankRows = isAlarmReceiveTrend ? [
        { name: '西城派出所', value: '218 起' },
        { name: '东城派出所', value: '196 起' },
        { name: '南城派出所', value: '173 起' },
        { name: '交警一中队', value: '139 起' },
        { name: '中心商圈警务站', value: '122 起' }
      ] : buildInsightRankRows(object, scenario);
      const pieRows = isAlarmReceiveTrend ? [
        { name: '需关注', value: '42%', color: '#1f5fbf' },
        { name: '运行中', value: '26%', color: '#60a5fa' },
        { name: '待处理', value: '16%', color: '#f59e0b' },
        { name: '已闭环', value: '16%', color: '#22c55e' }
      ] : buildInsightPieRows(scenario);
      const baseCode = `${object.id}_${slugText(scenario.title || 'scenario')}`;
      const rankKey = `${baseCode}_rank`;
      const pieKey = `${baseCode}_pie`;
      ensureInsightConfig(scenario, rankKey, 'rank', `${scenario.title}责任单位排行`, '当前板块由主题库场景 SQL 配置生成，帮助业务用户先定位重点责任单位。', object);
      ensureInsightConfig(scenario, pieKey, 'pie', `${scenario.title}类型占比`, '当前板块由主题库场景 SQL 配置生成，展示当前场景不同状态或类型的占比。', object);
      const rankConfig = scenario.insightBlocks[rankKey];
      const pieConfig = scenario.insightBlocks[pieKey];
      const rankVisible = !state.hiddenInsights.has(rankKey) && !state.deletedInsights.has(rankKey);
      const pieVisible = !state.hiddenInsights.has(pieKey) && !state.deletedInsights.has(pieKey);
      if (!rankVisible && !pieVisible) return '';
      const blockConfigs = [
        { key: rankKey, visible: rankVisible, config: rankConfig, rows: rankRows, defaultType: 'list' },
        { key: pieKey, visible: pieVisible, config: pieConfig, rows: pieRows, defaultType: 'pie' }
      ].filter(item => item.visible).sort((a, b) => (a.config.order ?? 0) - (b.config.order ?? 0));
      return `
        <div class="scenarioBlockGrid">
          ${blockConfigs.map(item => `<section class="scenarioBlock ${item.config.width === 'full' ? 'full' : ''}" data-insight-block="${item.key}">
            <div class="scenarioBlockHead">
              <div>
                <h4>${escapeHtml(item.config.title)}</h4>
              </div>
              ${canEdit() ? `<span class="blockActionGroup"><button type="button" data-edit-insight="${item.key}" data-insight-type="${item.config.type || item.defaultType}">编辑</button><button type="button" data-hide-insight="${item.key}">隐藏</button><button type="button" data-delete-insight="${item.key}">删除</button><span class="layoutControls"><button type="button" data-move-insight="${item.key}" data-direction="-1">上移</button><button type="button" data-move-insight="${item.key}" data-direction="1">下移</button></span></span>` : ''}
            </div>
            <p class="remark">${escapeHtml(item.config.description)}</p>
            ${renderInsightVisualization(item.config.displayType || item.defaultType, item.rows)}
          </section>`).join('')}
        </div>
      `;
    }

    function renderInsightVisualization(type, rows) {
      if (type === 'pie') {
        return `<div class="miniPiePanel"><div class="miniPieChart"></div><ul class="miniLegend">${rows.map(item => `<li><i style="background:${item.color || '#1f5fbf'}"></i><span>${item.name}</span><b>${item.value}</b></li>`).join('')}</ul></div>`;
      }
      if (type === 'bar') {
        const max = Math.max(...rows.map(item => Number(String(item.value).replace(/[^\d.]/g, '')) || 0), 1);
        return `<div class="miniBarChart">${rows.map(item => {
          const value = Number(String(item.value).replace(/[^\d.]/g, '')) || 0;
          return `<div class="miniBarRow"><span>${item.name}</span><span class="miniBarTrack"><i class="miniBarFill" style="width:${Math.max(8, value / max * 100)}%"></i></span><b>${item.value}</b></div>`;
        }).join('')}</div>`;
      }
      return `<ol class="miniRankList">${rows.map((item, index) => `<li><span>${index + 1}</span><span>${item.name}</span><b>${item.value}</b></li>`).join('')}</ol>`;
    }

    function buildInsightRankRows(object, scenario) {
      const items = scenario.items || [];
      if (items.length) {
        return items.slice(0, 5).map((item, index) => ({
          name: item.unit || `责任单位${index + 1}`,
          value: `${18 + index * 9 + object.name.length} 条`
        }));
      }
      return [
        { name: object.owner || '业务责任组', value: '42 条' },
        { name: object.systems?.[0] || '来源系统', value: '36 条' },
        { name: '数据治理组', value: '29 条' },
        { name: '辖区派出所', value: '22 条' },
        { name: '业务支队', value: '18 条' }
      ];
    }

    function buildInsightPieRows(scenario) {
      const attention = (scenario.summary || [])[3]?.value || '16 条';
      return [
        { name: '需关注', value: '36%', color: '#1f5fbf' },
        { name: '运行中', value: '31%', color: '#60a5fa' },
        { name: '待处理', value: attention.includes('%') ? attention : '18%', color: '#f59e0b' },
        { name: '已闭环', value: '15%', color: '#22c55e' }
      ];
    }

    function ensureInsightConfig(scenario, key, type, title, description, object) {
      if (!scenario.insightBlocks) scenario.insightBlocks = {};
      if (scenario.insightBlocks[key]) return scenario.insightBlocks[key];
      scenario.insightBlocks[key] = {
        key,
        type,
        title,
        description,
        datasource: defaultDatasourceForObject(object),
        sql: defaultInsightSql(object, scenario, type),
        displayType: type === 'pie' ? 'pie' : 'list',
        width: 'half',
        order: type === 'pie' ? 2 : 1
      };
      return scenario.insightBlocks[key];
    }

    function defaultInsightSql(object, scenario, type) {
      const tableName = object.assets?.[0]?.code || object.id.replaceAll('-', '_');
      if (type === 'rank') {
        return `select\n  org_name,\n  count(*) as total_count\nfrom ${tableName}\nwhere stat_date = current_date\ngroup by org_name\norder by total_count desc\nlimit 5;`;
      }
      return `select\n  status_name,\n  round(count(*) * 100.0 / sum(count(*)) over(), 1) as ratio\nfrom ${tableName}\nwhere stat_date = current_date\ngroup by status_name\norder by ratio desc;`;
    }

    function datasourceLabelForObject(object) {
      if ((object.systems || []).some(item => item.includes('110'))) return 'Oracle / 110_alarm_core';
      if ((object.systems || []).some(item => item.includes('执法') || item.includes('卷宗'))) return 'PostgreSQL / law_enforce_dw';
      return 'MySQL / police_warehouse_prod';
    }

    function slugText(value) {
      return String(value || 'scenario').replace(/[^\w\u4e00-\u9fa5]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 24) || 'scenario';
    }

    function bindScenarioWorkspace(main, object, scenario) {
      const status = main.querySelector('[data-query-status]');
      const body = main.querySelector('[data-result-body]');
      if (scenario.queryRows) body.innerHTML = renderScenarioRows(scenario.queryRows);
      status.textContent = queryStatusText(scenario);
      main.querySelectorAll('[data-open-sql]').forEach(button => button.addEventListener('click', () => {
        openSqlModal(object, scenario, main);
      }));
      main.querySelectorAll('[data-edit-insight]').forEach(button => button.addEventListener('click', () => {
        openInsightModal(object, scenario, main, button.dataset.editInsight, button.dataset.insightType);
      }));
      main.querySelectorAll('[data-hide-insight]').forEach(button => button.addEventListener('click', () => {
        state.hiddenInsights.add(button.dataset.hideInsight);
        main.innerHTML = renderScenarioWorkspace(object, scenario, 0);
        bindScenarioWorkspace(main, object, scenario);
      }));
      main.querySelectorAll('[data-delete-insight]').forEach(button => button.addEventListener('click', () => {
        if (!window.confirm('确认删除这个分析板块吗？')) return;
        state.deletedInsights.add(button.dataset.deleteInsight);
        main.innerHTML = renderScenarioWorkspace(object, scenario, 0);
        bindScenarioWorkspace(main, object, scenario);
      }));
      main.querySelectorAll('[data-move-insight]').forEach(button => button.addEventListener('click', () => {
        if (!scenario.insightBlocks) return;
        const key = button.dataset.moveInsight;
        const direction = Number(button.dataset.direction);
        const current = scenario.insightBlocks[key];
        if (!current) return;
        current.order = Math.max(1, (current.order || 1) + direction);
        Object.entries(scenario.insightBlocks).forEach(([otherKey, config]) => {
          if (otherKey !== key && config.order === current.order) config.order = Math.max(1, config.order - direction);
        });
        main.innerHTML = renderScenarioWorkspace(object, scenario, 0);
        bindScenarioWorkspace(main, object, scenario);
      }));
    }

      applySqlRows(rows);

    function previewSqlInModal() {
      const object = sqlState.object;
      const scenario = sqlState.scenario;
      const datasource = document.getElementById('sqlDatasourceSelect');
      const editor = document.getElementById('sqlModalEditor');
      const status = document.getElementById('sqlModalStatus');
      const previewWrap = document.getElementById('sqlPreviewWrap');
      const previewBody = document.getElementById('sqlPreviewBody');
      const sql = (editor.value || '').trim();
      if (!sql) {
        status.textContent = '请先输入 SQL 语句。';
        status.className = 'queryStatus warn';
        editor.focus();
        return null;
      }
      scenario.sqlConfig = {
        datasource: datasource.value,
        datasourceLabel: selectedDatasourceLabel(datasource),
        sql
      };
      const rows = buildSqlRows(sql, object, scenario);
      previewBody.innerHTML = renderScenarioRows(rows);
      previewWrap.classList.remove('hidden');
      status.textContent = `预览完成，返回 ${rows.length} 行。`;
      status.className = 'queryStatus success';
      return rows;

          <input type="hidden" name="createType" value="domain" />
          <label>主题名称<input class="fieldInput" name="主题名称" placeholder="例如：巡防域" required /></label>
          <label>主题编码<input class="fieldInput" name="主题编码" placeholder="例如：patrol" /></label>
          <label>负责人<input class="fieldInput" name="负责人" placeholder="请输入负责人或责任组" /></label>
          <label>覆盖部门<input class="fieldInput" name="覆盖部门" placeholder="请输入覆盖部门" /></label>
          <label>建设状态<select class="fieldInput" name="建设状态">${statusOptions}</select></label>
          <label class="span2">业务说明<textarea name="业务说明" placeholder="请输入该主题覆盖的公安业务范围"></textarea></label>
        `;
      }
      if (type === 'object') {
        return `
          <input type="hidden" name="createType" value="object" />
          <label>所属主题域<select class="fieldInput" name="所属主题域">${domainOptions}</select></label>
          <label>业务名称<input class="fieldInput" name="对象名称" placeholder="例如：巡防任务" required /></label>
          <label>负责人<input class="fieldInput" name="负责人" placeholder="请输入负责人或责任组" /></label>
          <label>建设状态<select class="fieldInput" name="建设状态">${statusOptions}</select></label>
          <label class="span2">业务定义<textarea name="业务定义" placeholder="说明这个业务是什么" required></textarea></label>
        `;
      }
      return `
        <input type="hidden" name="createType" value="asset" />
        <label>所属主题域<select class="fieldInput" name="场景所属主题域" id="scenarioDomainSelect">${domainOptions}</select></label>
        <label>所属业务项<select class="fieldInput" name="所属业务对象" id="scenarioObjectSelect">${activeObjectOptions}</select></label>
        <label>场景名称<input class="fieldInput" name="资产名称" placeholder="例如：巡防任务趋势分析" required /></label>
        <label>场景类型<select class="fieldInput" name="资产类型">${assetTypeOptions}</select></label>
        <label>表路径或服务路径<input class="fieldInput" name="表路径或服务路径" placeholder="请输入表路径或服务路径" /></label>
        <label>敏感级别<select class="fieldInput" name="敏感级别">${securityOptions}</select></label>
        <label>更新频率<select class="fieldInput" name="更新频率">${frequencyOptions}</select></label>
        <label>负责人<input class="fieldInput" name="负责人" placeholder="请输入负责人或责任组" /></label>
        <label class="span2">业务说明<textarea name="业务说明" placeholder="说明这个分析场景用于支撑什么业务"></textarea></label>
      `;
    }

    function openCreateModal(type) {
      const modal = document.getElementById('createModal');
      const form = document.getElementById('createModalForm');
      form.reset();
      document.getElementById('createModalFields').innerHTML = renderCreateFields(type);
      bindCreateModalCascades();
      modal.classList.remove('hidden');
      const firstField = form.querySelector('input:not([type="hidden"]), select, textarea');
      if (firstField) firstField.focus();
    }

    function fillEditForm(type, target) {
      const form = document.getElementById('createModalForm');
      if (type === 'domain') {
        const domain = themeDomains.find(item => item.id === target);
        if (!domain) return;
        form.elements['主题名称'].value = domain.name || '';
        form.elements['主题编码'].value = domain.id || '';
        form.elements['负责人'].value = domain.owner || '';
        form.elements['建设状态'].value = domain.status || '建设中';
        return;
      }
      if (type === 'object') {
        const [domainId, objectId] = target.split('::');
        const domain = themeDomains.find(item => item.id === domainId);
        const object = domain?.objects.find(item => item.id === objectId);
        if (!domain || !object) return;
        form.elements['所属主题域'].value = domain.id;
        form.elements['对象名称'].value = object.name || '';
        form.elements['负责人'].value = object.owner || '';
        form.elements['建设状态'].value = object.status || '建设中';
        form.elements['业务定义'].value = object.definition || '';
        return;
      }
      const [domainId, objectId, scenarioIndex] = target.split('::');
      const domain = themeDomains.find(item => item.id === domainId);
      const object = domain?.objects.find(item => item.id === objectId);
      const scenario = object?.scenarios?.[Number(scenarioIndex)] || assetScenarios(object || {})[Number(scenarioIndex)];
      if (!domain || !object || !scenario) return;
      form.elements['场景所属主题域'].value = domain.id;
      form.elements['所属业务对象'].innerHTML = domain.objects.map(item => `<option value="${domain.id}::${item.id}">${item.name}</option>`).join('');
      form.elements['所属业务对象'].value = `${domain.id}::${object.id}`;
      form.elements['资产名称'].value = scenario.title || '';
      form.elements['负责人'].value = object.owner || '';
      form.elements['业务说明'].value = scenario.goal || '';
    }

    function bindCreateModalCascades() {
      const domainSelect = document.getElementById('scenarioDomainSelect');
      const objectSelect = document.getElementById('scenarioObjectSelect');
      if (!domainSelect || !objectSelect) return;
      const refreshObjects = () => {
        const domain = realDomains().find(item => item.id === domainSelect.value) || realDomains()[0];
        objectSelect.innerHTML = domain.objects.map(object => `<option value="${domain.id}::${object.id}">${object.name}</option>`).join('');
      };
      domainSelect.addEventListener('change', refreshObjects);
    }

    function closeCreateModal() {
      document.getElementById('createModal').classList.add('hidden');
    }

    function slugify(value, fallback) {
      const slug = (value || '').toLowerCase().replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
      return slug || fallback;
    }

    function createFromModalForm(form) {
      const data = new FormData(form);
      const type = data.get('createType');
      if (state.editing) {
        updateFromModalForm(data);
      } else if (type === 'domain') {
        createDomainFromForm(data);
      } else if (type === 'object') {
        createObjectFromForm(data);
      } else {
        createAssetFromForm(data);
      }
      state.editing = null;
      closeCreateModal();
      renderAll();
    }

    function updateFromModalForm(data) {
      const { type, target } = state.editing;
      if (type === 'domain') {
        const domain = themeDomains.find(item => item.id === target);
        if (!domain) return;
        domain.name = (data.get('主题名称') || '').trim() || domain.name;
        domain.owner = (data.get('负责人') || '').trim() || domain.owner;
        domain.status = (data.get('建设状态') || '').trim() || domain.status;
        state.notice = `已更新主题“${domain.name}”。`;
        return;
      }
      if (type === 'object') {
        const [domainId, objectId] = target.split('::');
        const domain = themeDomains.find(item => item.id === domainId);
        const object = domain?.objects.find(item => item.id === objectId);
        if (!object) return;
        object.name = (data.get('对象名称') || '').trim() || object.name;
        object.definition = (data.get('业务定义') || '').trim() || object.definition;
        object.owner = (data.get('负责人') || '').trim() || object.owner;
        object.status = (data.get('建设状态') || '').trim() || object.status;
        state.domainId = domain.id;
        state.objectId = object.id;
        state.notice = `已更新业务项“${object.name}”。`;
        return;
      }
      const [domainId, objectId, scenarioIndex] = target.split('::');
      const domain = themeDomains.find(item => item.id === domainId);
      const object = domain?.objects.find(item => item.id === objectId);
      if (!object) return;
      if (!object.scenarios) object.scenarios = assetScenarios(object);
      const scenario = object.scenarios[Number(scenarioIndex)];
      if (!scenario) return;
      scenario.title = (data.get('资产名称') || '').trim() || scenario.title;
      scenario.goal = (data.get('业务说明') || '').trim() || scenario.goal;
      state.domainId = domain.id;
      state.objectId = object.id;
      state.notice = `已更新分析场景“${scenario.title}”。`;
    }

    function createDomainFromForm(data) {
      const name = (data.get('主题名称') || '').trim() || `新建主题${realDomains().length + 1}`;
      const rawCode = (data.get('主题编码') || '').trim();
      const id = slugify(rawCode || name, `theme-${Date.now()}`);
      const owner = (data.get('负责人') || '').trim() || '待指定';
      const status = (data.get('建设状态') || '').trim() || '建设中';
      themeDomains.push({
        id,
        name,
        owner,
        status,
        objects: []
      });
      state.domainId = id;
      state.objectId = '';
      state.tab = 'overview';
      state.notice = `已保存“${name}”，并追加到全部主题列表最后。`;
    }

    function createObjectFromForm(data) {
      const domainId = data.get('所属主题域') || realDomains()[0].id;
      const domain = themeDomains.find(item => item.id === domainId) || realDomains()[0];
      const name = (data.get('对象名称') || '').trim() || `新增业务项${domain.objects.length + 1}`;
      const id = slugify(name, `object-${Date.now()}`);
      const definition = (data.get('业务定义') || '').trim() || `记录${name}相关业务过程和关键数据。`;
      const scope = '围绕该业务的数量、趋势、重点单位和待关注事项。';
      const questions = ['当前总量是多少', '哪些单位变化明显', '是否存在异常或待治理事项'];
      const system = `${domain.name}业务系统`;
      const owner = (data.get('负责人') || '').trim() || '待指定';
      domain.objects.push({
        id,
        name,
        definition,
        scope,
        questions,
        systems: [system],
        owner,
        status: (data.get('建设状态') || '').trim() || '建设中',
        assets: [],
        fields: [],
        metrics: []
      });
      state.domainId = domain.id;
      state.objectId = id;
      state.tab = 'overview';
      state.notice = `已保存“${name}”，并追加到${domain.name}的业务项列表最后。`;
    }

    function createAssetFromForm(data) {
      const selected = (data.get('所属业务对象') || '').split('::');
      const domain = themeDomains.find(item => item.id === selected[0]) || getActiveDomain();
      const object = domain.objects.find(item => item.id === selected[1]) || getActiveObject();
      if (!object) {
        state.notice = '当前没有可挂载分析场景的业务项，请先新增业务项。';
        return;
      }
      const name = (data.get('资产名称') || '').trim() || `新增分析场景${object.assets.length + 1}`;
      object.assets.push({
        name,
        code: slugify(name, `asset-${Date.now()}`),
        type: (data.get('资产类型') || '').trim() || '明细表',
        source: object.systems?.[0] || `${domain.name}业务系统`,
        frequency: (data.get('更新频率') || '').trim() || '日级',
        security: (data.get('敏感级别') || '').trim() || '内部',
        owner: (data.get('负责人') || '').trim() || '待指定',
        relatedObjects: [object.name],
        usageByObject: { [object.name]: (data.get('业务说明') || '').trim() || '仅当前业务对象使用。' }
      });
      state.domainId = domain.id;
      state.objectId = object.id;
      state.tab = 'assets';
      state.notice = `已保存“${name}”，并追加到${object.name}的分析场景最后。`;
    }

    function renderAll() {
      renderDomains();
      renderContent();
      document.querySelectorAll('[data-edit-only]').forEach(item => {
        item.classList.toggle('hidden', !canEdit());
      });
    }

    document.getElementById('closeCreateModal').addEventListener('click', closeCreateModal);
    document.getElementById('cancelCreateModal').addEventListener('click', closeCreateModal);
    document.getElementById('createModalForm').addEventListener('submit', event => {
      event.preventDefault();
      createFromModalForm(event.currentTarget);
    });
    document.getElementById('createModal').addEventListener('click', event => {
      if (event.target.id === 'createModal') closeCreateModal();
    });
    document.getElementById('sqlModalForm').addEventListener('submit', saveAndRunSql);
    document.querySelector('[data-close-sql-modal]').addEventListener('click', closeSqlModal);
    document.querySelector('[data-preview-sql-modal]').addEventListener('click', previewSqlInModal);
    document.getElementById('sqlModal').addEventListener('click', event => {
      if (event.target.id === 'sqlModal') closeSqlModal();
    });
    document.getElementById('insightModalForm').addEventListener('submit', event => {
      event.preventDefault();
      const scenario = insightEditState.scenario;
      const main = insightEditState.main;
      const key = insightEditState.key;
      const object = insightEditState.object;
      if (!scenario || !main || !key) return;
      if (!scenario.insightBlocks) scenario.insightBlocks = {};
      const form = new FormData(event.currentTarget);
      const config = scenario.insightBlocks[key] || {};
      scenario.insightBlocks[key] = {
        ...config,
        key,
        type: insightEditState.type,
        title: (form.get('title') || '').trim() || config.title || '分析板块',
        description: (form.get('description') || '').trim() || config.description || '当前板块由主题库场景 SQL 配置生成。',
        datasource: form.get('datasource') || config.datasource || 'mysql-police-warehouse',
        sql: (form.get('sql') || '').trim(),
        displayType: form.get('displayType') || config.displayType || 'list',
        width: form.get('width') || config.width || 'half',
        order: config.order ?? (insightEditState.type === 'pie' ? 2 : 1)
      };
      closeInsightModal();
      main.innerHTML = renderScenarioWorkspace(object, scenario, 0);
      bindScenarioWorkspace(main, object, scenario);
    });
    document.querySelectorAll('[data-close-insight-modal]').forEach(button => {
      button.addEventListener('click', closeInsightModal);
    });
    document.querySelector('[data-preview-insight-sql]').addEventListener('click', previewInsightSql);
    document.getElementById('insightModal').addEventListener('click', event => {
      if (event.target.id === 'insightModal') closeInsightModal();
    });
    document.getElementById('objectStatsModalForm').addEventListener('submit', event => {
      event.preventDefault();
      const object = objectEditState.object;
      if (!object) return;
      const form = new FormData(event.currentTarget);
      object.name = (form.get('name') || '').trim() || object.name;
      object.status = (form.get('status') || '').trim() || object.status;
      object.definition = (form.get('definition') || '').trim() || object.definition;
      object.scope = (form.get('scope') || '').trim() || object.scope;
      object.statItems = readObjectStatItemsFromModal();
      object.statConfig = null;
      closeObjectStatsModal();
      renderAll();
    });
    document.querySelector('[data-add-object-stat]').addEventListener('click', () => {
      const current = readObjectStatItemsFromModal();
      current.push({
        label: `统计项${current.length + 1}`,
        value: '0',
        sql: 'select count(*) as value\nfrom your_table\nwhere stat_date = current_date;'
      });
      renderObjectStatConfigList(current);
    });
    document.querySelectorAll('[data-close-object-stats-modal]').forEach(button => {
      button.addEventListener('click', closeObjectStatsModal);
    });
    document.getElementById('objectStatsModal').addEventListener('click', event => {
      if (event.target.id === 'objectStatsModal') closeObjectStatsModal();
    });
    document.querySelectorAll('[data-create-type]').forEach(button => {
      button.addEventListener('click', () => openCreateForm(button.dataset.createType));
    });
    document.getElementById('globalSearch').addEventListener('input', event => {
      renderContent();
    });
    document.getElementById('roleSelect').addEventListener('change', event => {
      state.role = event.target.value;
      state.notice = event.target.value === 'viewer' ? '当前为只读用户，只能查看主题、业务项和查询结果。' : '';
      renderAll();
    });
    const splitter = document.getElementById('paneSplitter');
    splitter.addEventListener('mousedown', () => {
      splitter.classList.add('dragging');
      document.body.style.userSelect = 'none';
    });
    document.addEventListener('mousemove', event => {
      if (!splitter.classList.contains('dragging')) return;
      const width = event.clientX < 80 ? 0 : Math.min(460, Math.max(220, event.clientX));
      document.documentElement.style.setProperty('--domain-width', `${width}px`);
      document.querySelector('.workspace').classList.toggle('domainCollapsed', width === 0);
    });
    document.addEventListener('mouseup', () => {
      splitter.classList.remove('dragging');
      document.body.style.userSelect = '';
    });
    renderAll();
  </script>
</body>
</html>
